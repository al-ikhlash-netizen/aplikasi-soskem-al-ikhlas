flex;justify-content:center;z-index:20}.nav{width:min(1180px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;padding:8px 4px;color:#71807b;font-size:11px}.nav button.active{color:var(--green);font-weight:800}.nav i{display:block;font-style:normal;font-size:19px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.search{width:min(330px,100%);padding:10px 12px;border:1px solid #d9e3df;border-radius:10px;background:#fff}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.modalbox{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modalbox h3{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid #d7e1de;border-radius:9px;padding:10px;background:#fff}.footer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.quarter{display:flex;gap:6px;flex-wrap:wrap}.q{border:1px solid #ccd9d4;border-radius:999px;padding:7px 10px;background:#fff}.q.on{background:#dff5ec;border-color:#8dd4b9;color:#08704f;font-weight:700}.empty{text-align:center;padding:28px;color:var(--muted)}.rwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rw{padding:13px;border-radius:12px;background:#f0f7f4;text-align:center}.rw b{font-size:20px;display:block}.notice{padding:12px;border-radius:12px;background:#fff8e6;border:1px solid #f1dc9b;color:#6c5317}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.rwgrid{grid-template-columns:1fr 1fr}.stat b{font-size:19px}.wrap{padding-top:14px}.brand h1{font-size:15px}}

</style></head><body><div class="app"><header class="top"><div id="pwaStatus" style="display:none"></div><button id="installBtn" class="btn gold" style="display:none;position:absolute;right:12px;top:12px;z-index:5" type="button">⬇ Instal App</button><div class="brand"><img src="assets/logomasjid.png"><div><h1>SOSKEM DKM Jami Al-Ikhlash</h1><p>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</p></div></div></header><main class="wrap" id="content"></main><div class="bottom"><nav class="nav"><button data-page="home"><i>⌂</i>Dashboard</button><button data-page="kk"><i>▣</i>Master KK</button><button data-page="iuran"><i>✓</i>Iuran</button><button data-page="santunan"><i>♥</i>Santunan</button><button data-page="lainnya"><i>☷</i>Lainnya</button></nav></div></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><input id="fileRestore" type="file" accept="application/json" class="hidden"><script>
const KEY='SOSKEM_JAMI_AL_IKHLASH_WEB_V2';const EMPTY={masterKk:[],iuran:[],santunan:[],kas:[],settings:{saldoAwal:0}};let db=(()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?{...EMPTY,...x,settings:{...EMPTY.settings,...(x.settings||{})}}:structuredClone(EMPTY)}catch(e){return structuredClone(EMPTY)}})();let page='home';let editing=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>Date.now()+Math.floor(Math.random()*999);const today=()=>new Date().toISOString().slice(0,10);const kode=(rw,no)=>`ISK${rw}/${no}`;
function stats(){let masuk=db.kas.filter(x=>x.jenis==='PEMASUKAN').reduce((a,x)=>a+(+x.nominal||0),0), keluar=db.kas.filter(x=>x.jenis==='PENGELUARAN').reduce((a,x)=>a+(+x.nominal||0),0);return{kk:db.masterKk.filter(x=>x.status!=='NONAKTIF').length,iuran:db.iuran.reduce((a,x)=>a+(+x.nominal||0),0),santunan:db.santunan.reduce((a,x)=>a+(+x.nominal||0),0),saldo:(+db.settings.saldoAwal||0)+masuk-keluar,masuk,keluar}}
function nav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function render(){nav();let f={home:home,kk:master,iuran:iuran,santunan:santunan,lainnya:lainnya}[page]||home;document.getElementById('content').innerHTML=f();bind();}
function home(){let s=stats();return `<div class="grid"><div class="card stat"><small>Total KK Aktif</small><b>${s.kk}</b><span class="muted">Master keluarga</span></div><div class="card stat"><small>Total Iuran</small><b>${rupiah(s.iuran)}</b><span class="muted">Tercatat</span></div><div class="card stat"><small>Santunan Disalurkan</small><b>${rupiah(s.santunan)}</b><span class="muted">Dana duka</span></div><div class="card stat"><small>Saldo Kas</small><b>${rupiah(s.saldo)}</b><span class="muted">Kas SOSKEM</span></div></div><div class="section card"><div class="toolbar"><div><h2>Wilayah</h2><span class="muted">Rekap KK per RW</span></div><div class="actions"><button class="btn" data-go="kk">Master KK</button><button class="btn gold" data-go="kas">Buku Kas</button></div></div><div class="rwgrid" style="margin-top:12px">${['18','19','20'].map(r=>`<div class="rw"><small>RW ${r}</small><b>${db.masterKk.filter(x=>x.rw===r&&x.status!=='NONAKTIF').length}</b><span class="muted">KK aktif</span></div>`).join('')}</div></div><div class="section card"><h2>Mutasi Kas Terbaru</h2>${db.kas.length?`<div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Nominal</th><th>Keterangan</th></tr>${db.kas.slice().sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).slice(0,8).map(x=>`<tr><td>${esc(x.tanggal)}</td><td><span class="badge ${x.jenis==='PENGELUARAN'?'red':''}">${esc(x.jenis)}</span></td><td>${esc(x.kategori)}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.keterangan)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada mutasi transaksi kas.</div>'}</div>`}
function master(){let q=(document.getElementById('search')?.value||'').toLowerCase();let arr=db.masterKk.filter(x=>[x.namaKepalaKeluarga,x.nomorKK,x.kodeAnggota,x.rw,x.rt].join(' ').toLowerCase().includes(q));return `<div class="card"><div class="toolbar"><div><h2>Master KK</h2><span class="muted">Kelola keluarga dan kode anggota otomatis</span></div><div class="actions"><input id="search" class="search" placeholder="Cari KK / nama / kode" value="${esc(q)}"><button class="btn" data-add="kk">+ Tambah KK</button></div></div><div class="tablewrap" style="margin-top:12px">${arr.length?`<table class="table"><tr><th>Nama Kepala Keluarga</th><th>Kode</th><th>No KK</th><th>Wilayah</th><th>Status</th><th>Aksi</th></tr>${arr.map(x=>`<tr><td><b>${esc(x.namaKepalaKeluarga)}</b><br><small>${esc(x.noHp||'')}</small></td><td><span class="badge">${esc(x.kodeAnggota)}</span></td><td>${esc(x.nomorKK)}</td><td>RW ${esc(x.rw)} / RT ${esc(x.rt)}</td><td><span class="badge ${x.status==='NONAKTIF'?'red':''}">${esc(x.status)}</span></td><td><button class="btn gray" data-edit="${x.id}">Edit</button> <button class="btn red" data-del="${x.id}">Hapus</button></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada data Master KK.</div>'}</div></div>`}
function iuran(){return `<div class="card"><div class="toolbar"><div><h2>Pembayaran Iuran</h2><span class="muted">Pencatatan per tahun dan kuartal</span></div><button class="btn" data-add="iuran">+ Catat Iuran</button></div><div class="tablewrap" style="margin-top:12px">${db.iuran.length?`<table class="table"><tr><th>Anggota</th><th>Tahun</th><th>Kuartal</th><th>Tanggal</th><th>Nominal</th><th>Catatan</th></tr>${db.iuran.slice().reverse().map(x=>`<tr><td><b>${esc(x.namaKepalaKeluarga)}</b><br><small>${esc(x.kodeAnggota)} • RW ${esc(x.rw)}/${esc(x.rt)}</small></td><td>${x.tahun}</td><td>${['q1','q2','q3','q4'].filter(k=>x[k]).map(k=>k.toUpperCase()).join(', ')||'-'}</td><td>${esc(x.tanggalPembayaran)}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.catatan)}</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada pencatatan iuran.</div>'}</div></div>`}
function santunan(){return `<div class="card"><div class="toolbar"><div><h2>Penyaluran Santunan</h2><span class="muted">Pencatatan santunan duka dan potongan kas otomatis</span></div><button class="btn red" data-add="santunan">+ Salurkan Santunan</button></div><div class="tablewrap" style="margin-top:12px">${db.santunan.length?`<table class="table"><tr><th>Keluarga</th><th>Almarhum/Almarhumah</th><th>Ahli Waris</th><th>Tanggal</th><th>Nominal</th><th>Catatan</th></tr>${db.santunan.slice().reverse().map(x=>{let kk=db.masterKk.find(k=>k.id===x.masterKkId);return `<tr><td>${esc(kk?.namaKepalaKeluarga||x.kodeAnggota)}<br><small>${esc(x.kodeAnggota)}</small></td><td>${esc(x.namaAnggotaMeninggal)}</td><td>${esc(x.ahliWaris)}<br><small>${esc(x.hubunganAhliWaris)}</small></td><td>${esc(x.tanggal)}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.catatan)}</td></tr>`}).join('')}</table>`:'<div class="empty">Belum ada pencatatan santunan.</div>'}</div></div>`}
function lainnya(){return `<div class="grid"><div class="card"><h2>▣ Buku Kas</h2><p class="muted">Kelola pemasukan dan pengeluaran SOSKEM.</p><button class="btn" data-go="kas">Buka Buku Kas</button></div><div class="card"><h2>▤ Laporan</h2><p class="muted">Cetak laporan ringkas dari data aplikasi.</p><button class="btn blue" data-report>Pratinjau Laporan</button></div><div class="card"><h2>⇄ Backup & Restore</h2><p class="muted">Simpan seluruh data ke JSON atau pulihkan.</p><button class="btn gold" data-backup>Backup JSON</button> <button class="btn gray" data-restore>Restore</button></div><div class="card"><h2>⚙ Pengaturan</h2><p class="muted">Saldo awal dan informasi aplikasi.</p><button class="btn gray" data-settings>Pengaturan</button></div></div><div class="section card"><h2>Tentang</h2><p>SOSKEM DKM Jami Al-Ikhlash • Kp. Ciborerang, Bandung • RW 18, RW 19, RW 20.</p><div class="notice">Versi Web/PWA: 2.0.0 • Data tersimpan lokal di perangkat melalui localStorage.</div></div>`}
function kas(){let masuk=db.kas.filter(x=>x.jenis==='PEMASUKAN').reduce((a,x)=>a+x.nominal,0),keluar=db.kas.filter(x=>x.jenis==='PENGELUARAN').reduce((a,x)=>a+x.nominal,0);return `<div class="grid"><div class="card stat"><small>Saldo Awal</small><b>${rupiah(db.settings.saldoAwal)}</b></div><div class="card stat"><small>Total Pemasukan</small><b>${rupiah(masuk)}</b></div><div class="card stat"><small>Total Pengeluaran</small><b>${rupiah(keluar)}</b></div><div class="card stat"><small>Saldo Saat Ini</small><b>${rupiah((+db.settings.saldoAwal||0)+masuk-keluar)}</b></div></div><div class="section card"><div class="toolbar"><h2>Buku Kas SOSKEM</h2><button class="btn" data-add="kas">+ Tambah Mutasi</button></div><div class="tablewrap" style="margin-top:12px"><table class="table"><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Nominal</th><th>Keterangan</th><th></th></tr>${db.kas.slice().reverse().map(x=>`<tr><td>${esc(x.tanggal)}</td><td><span class="badge ${x.jenis==='PENGELUARAN'?'red':''}">${esc(x.jenis)}</span></td><td>${esc(x.kategori)}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.keterangan)}</td><td><button class="btn red" data-kasdel="${x.id}">Hapus</button></td></tr>`).join('')}</table></div></div>`}
function modal(title,body){document.getElementById('modalbox').innerHTML=`<h3>${title}</h3>${body}`;document.getElementById('modal').classList.add('show')};function closeModal(){document.getElementById('modal').classList.remove('show')}
function formKK(x={}){modal(x.id?'Edit Master KK':'Tambah Master KK',`<form id="form"><div class="formgrid"><div class="field"><label>Nama Kepala Keluarga *</label><input name="nama" required value="${esc(x.namaKepalaKeluarga)}"></div><div class="field"><label>Nomor KK 16 digit *</label><input name="kk" required maxlength="16" inputmode="numeric" value="${esc(x.nomorKK)}"></div><div class="field"><label>RW *</label><select name="rw"><option ${x.rw==='18'?'selected':''}>18</option><option ${x.rw==='19'?'selected':''}>19</option><option ${x.rw==='20'?'selected':''}>20</option></select></div><div class="field"><label>RT *</label><input name="rt" value="${esc(x.rt||'01')}"></div><div class="field"><label>Nomor Anggota Manual *</label><input name="no" required value="${esc(x.nomorAnggota)}"><small class="muted">Kode otomatis: ISK + RW / Nomor</small></div><div class="field"><label>Status</label><select name="status"><option ${x.status!=='NONAKTIF'?'selected':''}>AKTIF</option><option ${x.status==='NONAKTIF'?'selected':''}>NONAKTIF</option></select></div><div class="field"><label>No HP / WhatsApp</label><input name="hp" value="${esc(x.noHp)}"></div><div class="field"><label>Tanggal Terdaftar</label><input name="tgl" type="date" value="${esc(x.tanggalTerdaftar||today())}"></div><div class="field full"><label>Alamat Detail</label><textarea name="alamat">${esc(x.alamatDetail||'Kp. Ciborerang')}</textarea></div></div><div class="footer-actions"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan Data</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let item={id:x.id||uid(),nomorKK:d.kk,namaKepalaKeluarga:d.nama,rw:d.rw,rt:d.rt,nomorAnggota:d.no,kodeAnggota:kode(d.rw,d.no),status:d.status,tanggalTerdaftar:d.tgl,noHp:d.hp,alamatDetail:d.alamat};let i=db.masterKk.findIndex(a=>a.id===item.id);if(i>=0)db.masterKk[i]=item;else db.masterKk.push(item);save();closeModal();render()}}
function formIuran(){let opts=db.masterKk.filter(x=>x.status!=='NONAKTIF').map(x=>`<option value="${x.id}">${esc(x.namaKepalaKeluarga)} — ${esc(x.kodeAnggota)} (RW ${x.rw})</option>`).join('');modal('Pencatatan Iuran SOSKEM',`<form id="form"><div class="formgrid"><div class="field full"><label>Pilih Anggota / Kepala Keluarga *</label><select name="kk" required>${opts}</select></div><div class="field"><label>Tahun Iuran</label><input name="tahun" type="number" value="2026"></div><div class="field"><label>Nominal Fleksibel (Rp)</label><input name="nominal" type="number" min="0" required></div><div class="field full"><label>Kuartal / Triwulan</label><div class="quarter"><label class="q"><input type="checkbox" name="q1"> Q1 Jan-Mar</label><label class="q"><input type="checkbox" name="q2"> Q2 Apr-Jun</label><label class="q"><input type="checkbox" name="q3"> Q3 Jul-Sep</label><label class="q"><input type="checkbox" name="q4"> Q4 Okt-Des</label></div></div><div class="field"><label>Tanggal Bayar</label><input name="tgl" type="date" value="${today()}"></div><div class="field"><label>Catatan</label><input name="catatan"></div></div><div class="footer-actions"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan & Masuk Kas</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let kk=db.masterKk.find(x=>x.id==d.kk);if(!kk){alert('KK tidak ditemukan.');return}let qs=['q1','q2','q3','q4'].filter(q=>e.target[q].checked);if(!qs.length){alert('Pilih minimal satu triwulan.');return}let duplicate=db.iuran.some(r=>String(r.masterKkId)===String(kk.id)&&Number(r.tahun)===Number(d.tahun)&&qs.some(q=>r[q]));if(duplicate){alert('Ada triwulan yang sudah dibayar untuk KK dan tahun tersebut.');return}let nominal=+d.nominal||0;if(nominal<=0){alert('Nominal harus lebih dari 0.');return}let item={id:uid(),masterKkId:kk.id,kodeAnggota:kk.kodeAnggota,namaKepalaKeluarga:kk.namaKepalaKeluarga,rw:kk.rw,rt:kk.rt,tahun:+d.tahun,q1:e.target.q1.checked,q2:e.target.q2.checked,q3:e.target.q3.checked,q4:e.target.q4.checked,tanggalPembayaran:d.tgl,nominal:nominal,catatan:d.catatan||'',idTransaksiKas:uid(),periode:qs.map(q=>q.toUpperCase()).join(', ')};db.iuran.push(item);db.kas.push({id:item.idTransaksiKas,tanggal:d.tgl,jenis:'PEMASUKAN',kategori:'Iuran SOSKEM',nominal:nominal,keterangan:`Iuran ${kk.kodeAnggota} - ${kk.namaKepalaKeluarga}`,referensiId:item.id});save();closeModal();render()}}
function formSantunan(){let opts=db.masterKk.filter(x=>x.status!=='NONAKTIF').map(x=>`<option value="${x.id}">${esc(x.namaKepalaKeluarga)} — ${esc(x.kodeAnggota)}</option>`).join('');modal('Penyaluran Santunan Duka',`<form id="form"><div class="formgrid"><div class="field full"><label>Pilih Keluarga / KK *</label><select name="kk" required>${opts}</select></div><div class="field"><label>Nama Anggota yang Meninggal *</label><input name="meninggal" required></div><div class="field"><label>Tanggal Wafat *</label><input name="tgl" type="date" value="${today()}" required></div><div class="field"><label>Nama Penerima / Ahli Waris *</label><input name="waris" required></div><div class="field"><label>Hubungan Ahli Waris</label><input name="hubungan"></div><div class="field"><label>Nominal Santunan *</label><input name="nominal" type="number" required></div><div class="field"><label>Keterangan</label><input name="catatan"></div></div><div class="footer-actions"><button type="button" class="btn gray" data-close>Batal</button><button class="btn red">Salurkan & Potong Kas</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let kk=db.masterKk.find(x=>x.id==d.kk);if(!kk){alert('KK tidak ditemukan.');return}let nominal=+d.nominal||0;if(nominal<=0){alert('Nominal santunan harus lebih dari 0.');return}let id=uid(),kid=uid();let item={id,masterKkId:kk.id,kodeAnggota:kk.kodeAnggota,namaKepalaKeluarga:kk.namaKepalaKeluarga,nomorKK:kk.nomorKK,rw:kk.rw,rt:kk.rt,namaAnggotaMeninggal:d.meninggal,tanggal:d.tgl,ahliWaris:d.waris,hubunganAhliWaris:d.hubungan||'',nominal:nominal,catatan:d.catatan||'',idTransaksiKas:kid};db.santunan.push(item);db.kas.push({id:kid,tanggal:d.tgl,jenis:'PENGELUARAN',kategori:'Santunan',nominal:nominal,keterangan:`Santunan duka ${kk.kodeAnggota} - ${d.meninggal}`,referensiId:id});save();closeModal();render()}}
function formKas(){modal('Tambah Mutasi Kas',`<form id="form"><div class="formgrid"><div class="field"><label>Tanggal</label><input name="tgl" type="date" value="${today()}"></div><div class="field"><label>Jenis</label><select name="jenis"><option>PEMASUKAN</option><option>PENGELUARAN</option></select></div><div class="field"><label>Kategori</label><select name="kat"><option>Iuran SOSKEM</option><option>Sumbangan</option><option>Lainnya</option><option>Santunan</option><option>Operasional</option></select></div><div class="field"><label>Nominal</label><input name="nominal" type="number" required></div><div class="field full"><label>Keterangan</label><textarea name="ket" required></textarea></div></div><div class="footer-actions"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan Mutasi</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.kas.push({id:uid(),tanggal:d.tgl,jenis:d.jenis,kategori:d.kat,nominal:+d.nominal,keterangan:d.ket,referensiId:null});save();closeModal();render()}}
function settings(){modal('Pengaturan Sistem',`<form id="form"><div class="field"><label>Saldo Awal Kas</label><input name="saldo" type="number" value="${db.settings.saldoAwal||0}"></div><p class="muted">Data aplikasi disimpan lokal pada perangkat/browser ini.</p><div class="footer-actions"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();db.settings.saldoAwal=+new FormData(e.target).get('saldo');save();closeModal();render()}}
function backup(){let blob=new Blob([JSON.stringify({appName:'SOSKEM Jami Al-Ikhlash',organization:'DKM MASJID JAMI AL-IKHLASH',location:'KP. CIBORERANG, BANDUNG',coverage:'RW 18, RW 19, RW 20',version:'2.5.0',...db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BACKUP_SOSKEM_JAMI_AL_IKHLASH_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function report(){let s=stats();modal('Laporan Ringkas',`<div class="card"><h2>SOSKEM DKM Jami Al-Ikhlash</h2><p>RW 18 • RW 19 • RW 20</p><hr><p>Total KK Aktif: <b>${s.kk}</b></p><p>Total Iuran: <b>${rupiah(s.iuran)}</b></p><p>Total Santunan: <b>${rupiah(s.santunan)}</b></p><p>Saldo Kas: <b>${rupiah(s.saldo)}</b></p><div class="footer-actions"><button class="btn" onclick="window.print()">Cetak</button><button class="btn gray" data-close>Tutup</button></div></div>`)}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});let s=document.getElementById('search');if(s)s.oninput=()=>render();document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>b.dataset.add==='kk'?formKK():b.dataset.add==='iuran'?formIuran():b.dataset.add==='santunan'?formSantunan():formKas());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>formKK(db.masterKk.find(x=>x.id==b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let x=db.masterKk.find(x=>x.id==b.dataset.del);if(confirm(`Nonaktifkan ${x?.namaKepalaKeluarga}? Data transaksi tetap dipertahankan.`)){if(x){x.status='NONAKTIF';save();render()}}});document.querySelectorAll('[data-kasdel]').forEach(b=>b.onclick=()=>{let id=b.dataset.kasdel;let linked=db.iuran.some(x=>String(x.idTransaksiKas)===String(id))||db.santunan.some(x=>String(x.idTransaksiKas)===String(id));if(linked){alert('Mutasi ini terhubung dengan transaksi Iuran/Santunan dan tidak dapat dihapus dari Buku Kas.');return}if(confirm('Hapus mutasi kas ini?')){db.kas=db.kas.filter(x=>String(x.id)!==String(id));save();render()}});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelectorAll('[data-backup]').forEach(b=>b.onclick=backup);document.querySelectorAll('[data-report]').forEach(b=>b.onclick=report);document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=settings);document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=restore)}
function normalizeRestore(raw){
  // Accept this app's own backup format, a wrapped {data:...} format,
  // or a common export containing arrays under data/database/state.
  let x=raw;
  if(x && x.data && typeof x.data==='object') x=x.data;
  if(x && x.database && typeof x.database==='object') x=x.database;
  if(x && x.state && typeof x.state==='object') x=x.state;

  const arr=(...keys)=>{
    for(const k of keys){
      if(Array.isArray(x?.[k])) return x[k];
    }
    return [];
  };
  const obj=(...keys)=>{
    for(const k of keys){
      if(x?.[k] && typeof x[k]==='object' && !Array.isArray(x[k])) return x[k];
    }
    return {};
  };

  const masterKk=arr('masterKk','masterKK','master_kk','kk','keluarga','masterKeluarga');
  const iuran=arr('iuran','Iuran','pembayaranIuran','payments');
  const santunan=arr('santunan','Santunan','klaimSantunan','claims');
  const kas=arr('kas','Kas','transaksiKas','transactions','mutasiKas');
  const settings=obj('settings','pengaturan','config');

  return {
    masterKk, iuran, santunan, kas,
    settings:{saldoAwal:Number(settings.saldoAwal ?? settings.saldo_awal ?? 0) || 0}
  };
}

function restore(){
  const input=document.getElementById('fileRestore');
  input.value='';
  input.click();
}

document.getElementById('fileRestore').onchange=e=>{
  const f=e.target.files?.[0];
  if(!f) return;

  const r=new FileReader();
  r.onload=()=>{
    try{
      const raw=JSON.parse(String(r.result||''));
      const imported=normalizeRestore(raw);
      const total=imported.masterKk.length+imported.iuran.length+imported.santunan.length+imported.kas.length;

      if(total===0){
        alert('File JSON terbaca, tetapi tidak ditemukan data SOSKEM yang dapat dipulihkan. Data lama tidak diubah.');
        return;
      }

      const ok=confirm(
        `Data ditemukan:\\n\\n`+
        `Master KK: ${imported.masterKk.length}\\n`+
        `Iuran: ${imported.iuran.length}\\n`+
        `Santunan: ${imported.santunan.length}\\n`+
        `Mutasi Kas: ${imported.kas.length}\\n\\n`+
        `Lanjutkan restore dan mengganti data lokal saat ini?`
      );
      if(!ok) return;

      db=imported;
      save();
      render();

      const check=JSON.parse(localStorage.getItem(KEY)||'null')||{};
      const savedTotal=(check.masterKk?.length||0)+(check.iuran?.length||0)+(check.santunan?.length||0)+(check.kas?.length||0);
      alert(`Restore berhasil. ${savedTotal} data tersimpan di perangkat.`);
    }catch(err){
      console.error(err);
      alert('File JSON tidak valid atau formatnya tidak dapat dibaca.');
    }finally{
      e.target.value='';
    }
  };
  r.onerror=()=>alert('File JSON tidak dapat dibaca dari perangkat.');
  r.readAsText(f,'utf-8');
};

if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});render();
</script></body></html>
