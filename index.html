<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f5b"><link rel="icon" href="./logomasjid.png">
<title>SOSKEM DKM Jami Al-Ikhlash</title>
<style>
:root{--g:#087f5b;--bg:#f4f7f6;--ink:#16322b;--muted:#6d7c77;--gold:#b88925;--red:#c0392b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#056b4c,#0a8a62);color:#fff;padding:20px 18px;box-shadow:0 4px 14px #0002}.brand{display:flex;align-items:center;gap:12px;max-width:1180px;margin:auto}.brand img{width:52px;height:52px;border-radius:50%;background:#fff;padding:3px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0;opacity:.85}.marquee{max-width:1180px;margin:12px auto 0;overflow:hidden;border:1px solid #fff4;border-radius:999px;background:#fff2}.marquee-track{white-space:nowrap;padding:9px;font-weight:700;animation:marquee 18s linear infinite}@keyframes marquee{from{transform:translateX(100%)}to{transform:translateX(-100%)}}.wrap{max-width:1180px;margin:auto;padding:18px 14px 90px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e4ebe8;border-radius:14px;padding:15px;box-shadow:0 5px 18px #1232}.stat b{display:block;font-size:21px;margin-top:5px}.section{margin-top:15px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--g);color:#fff;font-weight:700}.btn.gold{background:var(--gold)}.btn.red{background:var(--red)}.btn.gray{background:#e8efee;color:var(--ink)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:9px 7px;border-bottom:1px solid #e9eeee;text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;box-shadow:0 -4px 15px #1232;z-index:5}.nav button{border:0;background:none;color:#71807b;padding:7px;border-radius:10px}.nav button.active{background:var(--g);color:#fff}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:10}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(680px,94%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field input,.field select{padding:10px;border:1px solid #d7e1dd;border-radius:8px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.muted{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.brand h1{font-size:17px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="./logomasjid.png" alt="Logo Masjid Jami Al-Ikhlash"><div><h1>SOSKEM DKM Jami Al-Ikhlash</h1><p>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</p></div></div><div class="marquee"><div class="marquee-track">Idarah Sistem Masjid Jami Al ikhlash Katapang</div></div></header>
<main id="content" class="wrap"></main>
<nav class="nav"><button data-page="home">⌂<br>Dashboard</button><button data-page="kk">▣<br>Master KK</button><button data-page="iuran">✓<br>Iuran</button><button data-page="tagihan">▤<br>Tagihan</button><button data-page="lainnya">☰<br>Lainnya</button></nav>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
'use strict';
const KEY='SOSKEM_JAMI_AL_IKHLASH_WEB_V2',empty={masterKk:[],iuran:[],santunan:[],kas:[]};let db=load(),page='home';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null')||{};return{masterKk:Array.isArray(x.masterKk)?x.masterKk:[],iuran:Array.isArray(x.iuran)?x.iuran:[],santunan:Array.isArray(x.santunan)?x.santunan:[],kas:Array.isArray(x.kas)?x.kas:[]}}catch(e){return structuredClone(empty)}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),id=()=>Date.now()+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),active=k=>k.status!=='NONAKTIF';
function findKode(v){v=String(v||'').trim().toUpperCase().replace(/\s/g,'');return db.masterKk.find(k=>[k.kodeBuku,k.kodeAnggota,k.kode,k.nomorKK,k.nomor].some(x=>String(x||'').toUpperCase().replace(/\s/g,'')===v))}
function stats(){return{kk:db.masterKk.filter(active).length,iuran:db.iuran.reduce((a,x)=>a+(+x.nominal||0),0),kas:db.kas.reduce((a,x)=>a+(x.jenis==='PENGELUARAN'?-(+x.nominal||0):(+x.nominal||0)),0)}}
function render(){const views={home,kk,iuran,tagihan,lainnya};document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=(views[page]||home)();bind()}
function home(){const s=stats();return `<div class="grid"><div class="card stat"><small>KK Aktif</small><b>${s.kk}</b></div><div class="card stat"><small>Total Iuran</small><b>${rupiah(s.iuran)}</b></div><div class="card stat"><small>Saldo Kas</small><b>${rupiah(s.kas)}</b></div><div class="card stat"><small>Data Iuran</small><b>${db.iuran.length}</b></div></div><div class="card section"><div class="toolbar"><h2>Dashboard Soskem</h2><button class="btn" data-go="kk">Kelola Master KK</button></div><p class="muted">Gunakan menu di bawah untuk mengelola data warga, iuran, dan mencetak buku tagihan.</p></div>`}
function kk(){return `<div class="card"><div class="toolbar"><h2>Master KK</h2><button class="btn" data-add="kk">+ Tambah KK</button></div><div class="tablewrap"><table class="table"><tr><th>Nama</th><th>Kode</th><th>No KK</th><th>RW/RT</th><th>Aksi</th></tr>${db.masterKk.filter(active).map(k=>`<tr><td>${esc(k.nama||k.namaKepalaKeluarga)}</td><td>${esc(k.kodeBuku||k.kodeAnggota||k.kode)}</td><td>${esc(k.nomorKK||k.nomor)}</td><td>${esc(k.rw||'-')}/${esc(k.rt||'-')}</td><td><button class="btn red" data-del="${k.id}">Nonaktifkan</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Belum ada data.</td></tr>'}</table></div></div>`}
function iuran(){return `<div class="card"><div class="toolbar"><h2>Pembayaran Iuran</h2><button class="btn" data-add="iuran">+ Catat Iuran</button></div><div class="tablewrap"><table class="table"><tr><th>Kode</th><th>Nama</th><th>Kuartal</th><th>Nominal</th></tr>${db.iuran.slice().reverse().map(x=>`<tr><td>${esc(x.kode)}</td><td>${esc(x.nama)}</td><td>${esc(x.quarter)}</td><td>${rupiah(x.nominal)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Belum ada pembayaran.</td></tr>'}</table></div></div>`}
function tagihan(){return `<div class="card"><h2>Cetak Tagihan Kuartal Berikutnya</h2><p class="muted">Cetak daftar tagihan seluruh KK aktif atau warga yang telah lunas pada kuartal berjalan.</p><div class="toolbar"><button class="btn gold" data-print>🖨️ Cetak Buku Tagihan</button> <button class="btn" data-print-next>🖨️ Cetak Tagihan Berikutnya</button></div></div>`}
function lainnya(){return `<div class="grid"><div class="card"><h2>Backup Data</h2><button class="btn" data-backup>Unduh JSON</button></div><div class="card"><h2>Informasi</h2><p class="muted">Data disimpan lokal di perangkat ini.</p></div></div>`}
function modal(title,body){document.getElementById('modalbox').innerHTML=`<h3>${title}</h3>${body}`;document.getElementById('modal').classList.add('show')};function closeModal(){document.getElementById('modal').classList.remove('show')}
function addKK(){modal('Tambah Master KK',`<form id="form"><div class="formgrid"><label class="field">Nama<input name="nama" required></label><label class="field">Kode Manual<input name="kode" placeholder="ISK18/001" required></label><label class="field">Nomor KK<input name="nomorKK"></label><label class="field">RW<input name="rw" value="18"></label><label class="field">RT<input name="rt" value="01"></label></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));db.masterKk.push({id:id(),...d,namaKepalaKeluarga:d.nama,kodeBuku:d.kode});save();closeModal();render()}}
function addIuran(){modal('Catat Iuran',`<form id="form"><div class="formgrid"><label class="field full">Kode Buku / Nomor KK<input id="kode" name="kode" required><small id="preview" class="muted"></small></label><label class="field">Kuartal<select name="quarter"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></label><label class="field">Nominal<input name="nominal" type="number" value="25000" required></label></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);const input=document.getElementById('kode');input.oninput=()=>{const k=findKode(input.value);document.getElementById('preview').textContent=k?`Ditemukan — No. KK: ${k.nomorKK||k.nomor||'-'} | Nama: ${k.nama||k.namaKepalaKeluarga||'-'}`:'Kode Buku belum ditemukan'};document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),k=findKode(d.kode);if(!k)return alert('Kode KK tidak ditemukan.');db.iuran.push({id:id(),kode:d.kode,nama:k.nama||k.namaKepalaKeluarga,quarter:d.quarter,nominal:+d.nominal});save();closeModal();render()}}
function printTagihan(){const rows=db.masterKk.filter(active);const w=window.open('','_blank');if(!w)return alert('Popup diblokir. Izinkan popup untuk mencetak.');w.document.write(`<html><head><title>Buku Tagihan</title><style>body{font:14px Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:8px}</style></head><body><h2>Buku Tagihan Soskem</h2><table><tr><th>No</th><th>Nama</th><th>Kode</th><th>Nominal</th></tr>${rows.map((k,i)=>`<tr><td>${i+1}</td><td>${esc(k.nama||k.namaKepalaKeluarga)}</td><td>${esc(k.kodeBuku||k.kode)}</td><td>Rp25.000</td></tr>`).join('')}</table></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function printTagihanKuartalBerikutnya(){const bulanSekarang=new Date().getMonth()+1;let kuartalBerjalan='Q1';if(bulanSekarang>=4&&bulanSekarang<=6){kuartalBerjalan='Q2'}else if(bulanSekarang>=7&&bulanSekarang<=9){kuartalBerjalan='Q3'}else if(bulanSekarang>=10&&bulanSekarang<=12){kuartalBerjalan='Q4'}const namaKuartal={Q1:'Kuartal 1',Q2:'Kuartal 2',Q3:'Kuartal 3',Q4:'Kuartal 4'};const sudahLunasKuartalBerjalan=warga=>{const kodeMaster=warga.kodeBuku||warga.kodeAnggota||warga.kode||'';return db.iuran.some(iuran=>{const wargaIuran=findKode(iuran.kode);const kodeIuranMaster=wargaIuran?(wargaIuran.kodeBuku||wargaIuran.kodeAnggota||wargaIuran.kode||''):String(iuran.kode||'');const kodeSama=String(kodeIuranMaster).trim().toUpperCase()===String(kodeMaster).trim().toUpperCase();return kodeSama&&iuran.quarter===kuartalBerjalan})};const rows=db.masterKk.filter(active).filter(sudahLunasKuartalBerjalan);if(rows.length===0){alert(`Belum ada warga aktif yang lunas pada ${namaKuartal[kuartalBerjalan]}.`);return}const w=window.open('','_blank');if(!w){alert('Popup diblokir. Izinkan popup untuk mencetak.');return}const safe=value=>esc(value||'-');const isiTabel=rows.map((warga,index)=>{const kodeBuku=warga.kodeBuku||warga.kodeAnggota||warga.kode||'-';const nomorKK=warga.nomorKK||warga.nomor||'-';const namaKK=warga.nama||warga.namaKepalaKeluarga||'-';return `<tr><td>${index+1}</td><td>${safe(kodeBuku)}</td><td>${safe(nomorKK)}</td><td>${safe(namaKK)}</td><td>Rp 25.000</td><td class="paraf"></td></tr>`}).join('');w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Tagihan ${namaKuartal[kuartalBerjalan]} Berikutnya</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#16322b}h1,h2,p{text-align:center;margin:4px 0}h1{font-size:20px;text-transform:uppercase}h2{font-size:16px;margin-top:8px}p{font-size:12px;margin-bottom:18px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #333;padding:8px;font-size:12px;text-align:left}th{background:#eef5f2;text-align:center}td:first-child{width:42px;text-align:center}td:last-child{width:120px;height:34px}.catatan{margin-top:16px;text-align:left;font-size:11px}@media print{body{padding:0}table{page-break-inside:auto}tr{page-break-inside:avoid}thead{display:table-header-group}}</style></head><body><h1>DKM Jami Al-Ikhlash</h1><h2>Daftar Tagihan SOSKEM ${namaKuartal[kuartalBerjalan]} Berikutnya</h2><p>Warga yang telah lunas pada ${namaKuartal[kuartalBerjalan]} dan masuk daftar penagihan kuartal berikutnya</p><table><thead><tr><th>No.</th><th>Kode Buku</th><th>No. KK</th><th>Nama Kepala Keluarga</th><th>Tagihan</th><th>Paraf</th></tr></thead><tbody>${isiTabel}</tbody></table><div class="catatan">Total data: <b>${rows.length} KK</b></div></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-add="kk"]').forEach(b=>b.onclick=addKK);document.querySelectorAll('[data-add="iuran"]').forEach(b=>b.onclick=addIuran);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelectorAll('[data-print]').forEach(b=>b.onclick=printTagihan);document.querySelectorAll('[data-print-next]').forEach(b=>b.onclick=printTagihanKuartalBerikutnya);document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const k=db.masterKk.find(x=>String(x.id)===b.dataset.del);if(k&&confirm('Nonaktifkan KK ini?')){k.status='NONAKTIF';save();render()}});document.querySelector('[data-backup]')?.addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-soskem.json';a.click()});document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}}
render();
</script>
</body>
</html>
