<title>SOSKEM DKM Jami Al-Ikhlash</title>
<style>
:root{--g:#087f5b;--gold:#b88925;--bg:#f4f7f6;--ink:#16322b;--muted:#6d7c77;--red:#c0392b;--blue:#1769aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#056b4c,#0a8a62);color:#fff;padding:16px 16px 10px;box-shadow:0 8px 18px rgba(0,0,0,.12)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;max-width:1180px;margin:0 auto}.brand img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px}.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0 0;font-size:11px;opacity:.82}.marquee{max-width:1180px;margin:8px auto 0;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}.marquee-track{white-space:nowrap;display:inline-block;padding:8px 0;min-width:100%;animation:marquee 18s linear infinite;color:#f7f9ee;font-weight:700;letter-spacing:.02em}@keyframes marquee{from{transform:translateX(100%)}to{transform:translateX(-100%)}}.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 92px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:15px;border:1px solid #e4ebe8;box-shadow:0 8px 28px rgba(18,53,42,.06)}.stat b{display:block;font-size:22px;margin-top:6px}.muted{color:var(--muted)}.section{margin-top:16px}.toolbar,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #e9eeed;text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f7faf9}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e4f5eb;color:#09593d;font-size:11px;font-weight:700}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;font-weight:700}.btn.gold{background:var(--gold)}.btn.red{background:var(--red)}.btn.gray{background:#e8efee;color:var(--ink)}.btn.blue{background:var(--blue)}.nav{position:fixed;left:0;right:0;bottom:0;max-width:1180px;margin:0 auto;padding:0 14px 8px;background:linear-gradient(to top,rgba(244,247,246,1),rgba(244,247,246,.82));display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.nav button{background:none;border:0;padding:8px 4px;color:#71807b;font-size:11px;border-radius:12px}.nav button.active{background:var(--g);color:#fff;font-weight:800}.search{width:min(330px,100%);padding:10px 12px;border:1px solid #d9e3df;border-radius:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}.modal.show{display:flex}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;box-shadow:0 -10px 32px rgba(0,0,0,.16)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{padding:10px 12px;border:1px solid #d7e1dd;border-radius:9px;width:100%}.kk-preview{min-height:18px;padding:4px 0;color:#0e6d4e;font-size:12px;font-weight:700}.toggle-row{display:flex;gap:12px;flex-wrap:wrap}.toggle-row label{display:flex;align-items:center;gap:6px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{padding:28px;color:var(--muted);text-align:center}.hidden{display:none !important}.print-table{width:100%;border-collapse:collapse}.print-table th,.print-table td{border:1px solid #2b3b36;padding:8px 6px;font-size:12px;vertical-align:top}.print-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.print-head h2{margin:0}.meta{font-size:12px;color:#3b4d47}.@media (max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.brand{justify-content:flex-start}.nav{grid-template-columns:repeat(5,1fr)}.brand p{display:none}}@media print{body{background:#fff}.nav,.modal{display:none !important}.wrap{padding:0}.card{box-shadow:none;border:1px solid #dfe9e4}.print-header{page-break-inside:avoid} .print-foot{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:#333;border-top:1px solid #999;padding-top:6px;background:#fff} }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="./logomasjid.png" alt="Logo Masjid Jami Al-Ikhlash">
    <div>
      <h1>SOSKEM DKM Jami Al-Ikhlash</h1>
      <p>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</p>
    </div>
  </div>
  <div class="marquee"><div class="marquee-track">Idarah Sistem Masjid Jami Al ikhlash Katapang</div></div>
</header>
<main id="content" class="wrap"></main>
<nav class="bottom nav">
  <button data-page="home">⌂<br>Dashboard</button>
  <button data-page="kk">▣<br>Master KK</button>
  <button data-page="iuran">✓<br>Iuran</button>
  <button data-page="santunan">✦<br>Santunan</button>
  <button data-page="lainnya">☰<br>Lainnya</button>
</nav>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<input id="fileRestore" type="file" accept="application/json,.json" class="hidden">
<script>
'use strict';
const KEY='SOSKEM_JAMI_AL_IKHLASH_WEB_V2',BACKUP_VERSION='2.6.0',EMPTY={masterKk:[],iuran:[],santunan:[],kas:[],settings:{saldoAwal:0}};
const clone=x=>JSON.parse(JSON.stringify(x));
const safeDb=x=>{const y=x&&typeof x==='object'?x:{};return{masterKk:Array.isArray(y.masterKk)?y.masterKk:[],iuran:Array.isArray(y.iuran)?y.iuran:[],santunan:Array.isArray(y.santunan)?y.santunan:[],kas:Array.isArray(y.kas)?y.kas:[],settings:y.settings&&typeof y.settings==='object'?{...y.settings,saldoAwal:Number(y.settings.saldoAwal||0)}:{saldoAwal:0}}};
function load(){try{return safeDb(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(_){return clone(EMPTY)}}
let db=load(),page='home';
const save=()=>localStorage.setItem(KEY,JSON.stringify(safeDb(db))),uid=()=>Date.now()+Math.floor(Math.random()*999),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0)),rwval=r=>String(r??'').trim().replace(/^RW\s*/i,'');
const active=k=>k&&(k.status||'AKTIF')!=='NONAKTIF'&&k.statusKalkulasi!=='NONAKTIF';
const quarterOrder=['Q1','Q2','Q3','Q4'];
function quarterIndex(q){const v=String(q||'').toUpperCase();const i=quarterOrder.indexOf(v);return i>=0?i:-1}
function currentQuarter(date=new Date()){const m=date.getMonth()+1;return m<=3?'Q1':m<=6?'Q2':m<=9?'Q3':'Q4'}
function nextQuarter(q){const idx=quarterIndex(q);if(idx<0)return 'Q1';return quarterOrder[(idx+1)%4]}
function nextQuarterFromDate(date=new Date()){return nextQuarter(currentQuarter(date))}
function currentYear(date=new Date()){return date.getFullYear()}
function compareQuarterWithYear(a,b){
  const ay=Number(a?.year||new Date().getFullYear()), by=Number(b?.year||new Date().getFullYear());
  const ai=quarterIndex(a?.quarter||'Q1'), bi=quarterIndex(b?.quarter||'Q1');
  if(ay!==by)return ay-by; return ai-bi;
}
function findMasterByKode(kode){
  const v=String(kode||'').trim().toUpperCase();
  if(!v)return null;
  return db.masterKk.find(k=>{
    const codes=[k.kodeBuku,k.kodeAnggota,k.kode,k.nomorKK,k.nomor].filter(Boolean).map(x=>String(x).trim().toUpperCase());
    return codes.includes(v) || codes.some(x=>x.replace(/\s+/g,'')===v.replace(/\s+/g,''));
  })||null;
}
function stats(){const masuk=db.kas.filter(x=>x.jenis==='PEMASUKAN').reduce((a,x)=>a+(+x.nominal||0),0),keluar=db.kas.filter(x=>x.jenis==='PENGELUARAN').reduce((a,x)=>a+(+x.nominal||0),0);return{kk:db.masterKk.filter(active).length,iuran:db.iuran.reduce((a,x)=>a+(+x.nominal||0),0),santunan:db.santunan.reduce((a,x)=>a+(+x.nominal||0),0,masuk,keluar),saldo:(+db.settings.saldoAwal||0)+masuk-keluar};}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=({home,kk:master,iuran,santunan,lainnya,kas}[page]||home)();bindDynamicEvents();}
function home(){const s=stats();return `<div class="grid">${[['KK Aktif',s.kk],['Total Iuran',rupiah(s.iuran)],['Santunan',rupiah(s.santunan)],['Saldo Kas',rupiah(s.saldo)]].map(x=>`<div class="card stat"><small class="muted">${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="section card"><div class="toolbar"><h2>Wilayah</h2><div class="actions"><button class="btn" data-go="kk">Master KK</button><button class="btn gold" data-go="kas">Buku Kas</button></div></div><div class="grid" style="margin-top:12px">${['18','19','20'].map(r=>`<div class="card"><small class="muted">RW ${r}</small><b>${db.masterKk.filter(k=>active(k)&&rwval(k.rw)===r).length}</b></div>`).join('')}</div></div><div class="section card"><h2>Mutasi Kas Terbaru</h2>${kasRows(8)}</div>`}
function master(){const q=(document.getElementById('search')?.value||'').toLowerCase(),rows=db.masterKk.filter(x=>JSON.stringify(x).toLowerCase().includes(q));return `<div class="card"><div class="toolbar"><h2>Master KK</h2><div class="actions"><input id="search" class="search" placeholder="Cari KK / nama / kode" value="${esc(q)}"><button class="btn" data-add="kk">+ Tambah KK</button></div></div></div><div class="tablewrap" style="margin-top:12px">${rows.length?`<table class="table"><tr><th>Nama</th><th>Kode</th><th>No KK</th><th>RW/RT</th><th>Status</th><th>Aksi</th></tr>${rows.map(x=>`<tr><td><b>${esc(x.namaKepalaKeluarga||x.nama||'-')}</b><br><small>${esc(x.noHp||x.telepon||'')}</small></td><td><span class="badge">${esc(x.kodeBuku||x.kodeAnggota||x.kode||'')}</span></td><td>${esc(x.nomorKK||x.nomor||'-')}</td><td>${esc(rwval(x.rw)||'-')}/${esc(x.rt||'-')}</td><td>${esc(x.status||'AKTIF')}</td><td><button class="btn gray" data-edit="${x.id}">Edit</button> <button class="btn red" data-del="${x.id}">Nonaktifkan</button></td></tr>`).join('')}</table>`:`<div class="empty">Belum ada data Master KK.</div>`}</div>`}
function iuran(){return `<div class="card"><div class="toolbar"><h2>Pembayaran Iuran</h2><button class="btn" data-add="iuran">+ Catat Iuran</button></div><div class="tablewrap" style="margin-top:12px">${db.iuran.length?`<table class="table"><tr><th>KK</th><th>Nama</th><th>RW/RT</th><th>Tahun</th><th>Triwulan</th><th>Nominal</th><th>Tanggal</th></tr>${db.iuran.slice().reverse().map(x=>`<tr><td>${esc(x.kodeAnggota||x.kode||'-')}</td><td>${esc(x.namaKepalaKeluarga||x.nama||'-')}</td><td>${esc(rwval(x.rw)||'-')}/${esc(x.rt||'-')}</td><td>${esc(x.tahun||new Date(x.tgl||Date.now()).getFullYear())}</td><td>${esc(x.triwulan||x.quarter||'-')}</td><td>${rupiah(x.nominal||0)}</td><td>${esc(x.tgl||x.tanggal||'-')}</td></tr>`).join('')}</table>`:`<div class="empty">Belum ada pencatatan iuran.</div>`}</div>`}
function santunan(){return `<div class="card"><div class="toolbar"><h2>Penyaluran Santunan</h2><button class="btn red" data-add="santunan">+ Salurkan Santunan</button></div><div class="tablewrap" style="margin-top:12px">${db.santunan.length?`<table class="table"><tr><th>KK</th><th>Nama</th><th>RW/RT</th><th>Nominal</th><th>Tanggal</th></tr>${db.santunan.slice().reverse().map(x=>`<tr><td>${esc(x.kodeAnggota||x.kode||'-')}</td><td>${esc(x.namaKepalaKeluarga||x.nama||'-')}</td><td>${esc(rwval(x.rw)||'-')}/${esc(x.rt||'-')}</td><td>${rupiah(x.nominal||0)}</td><td>${esc(x.tgl||x.tanggal||'-')}</td></tr>`).join('')}</table>`:`<div class="empty">Belum ada penyaluran santunan.</div>`}</div>`}
function lainnya(){return `<div class="grid"><div class="card"><h2>Buku Kas</h2><button class="btn" data-go="kas">Buka Buku Kas</button></div><div class="card"><h2>Rekap Iuran</h2><button class="btn blue" data-rekap="iuran">Rekap per RW</button></div><div class="card"><h2>Tagihan Kuartal</h2><button class="btn gold" data-tagihan="next">Cetak Buku Tagihan Kuartal Berikutnya</button></div><div class="card"><h2>Backup & Restore</h2><button class="btn" data-backup>Backup JSON</button> <button class="btn gray" data-restore>Restore</button></div></div><div class="section card"><div class="toolbar"><h2>Laporan</h2><button class="btn gray" data-report>Print Laporan</button></div><p class="muted">Rekapitulasi iuran berdasarkan RW dapat dicetak sesuai kuartal yang dipilih.</p></div>`}
function kasRows(limit=0){const rows=(limit?db.kas.slice().reverse().slice(0,limit):db.kas.slice().reverse());return rows.length?`<div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Nominal</th><th>Keterangan</th>${limit?'<th>Aksi</th>':''}</tr>${rows.map(x=>`<tr><td>${esc(x.tgl||x.tanggal||'-')}</td><td>${esc(x.jenis||'PEMASUKAN')}</td><td>${esc(x.kategori||x.keterangan||'-')}</td><td>${rupiah(x.nominal||0)}</td><td>${esc(x.keterangan||'-')}</td>${limit?`<td><button class="btn gray" data-kasdel="${x.id}">Hapus</button></td>`:''}</tr>`).join('')}</table></div>`:`<div class="empty">Belum ada mutasi kas.</div>`}
function kas(){const s=stats();return `<div class="grid">${[['Saldo Awal',db.settings.saldoAwal],['Pemasukan',s.masuk||0],['Pengeluaran',s.keluar||0],['Saldo',s.saldo]].map(x=>`<div class="card stat"><small class="muted">${x[0]}</small><b>${typeof x[1]==='number'?rupiah(x[1]):x[1]}</b></div>`).join('')}</div><div class="section card"><div class="toolbar"><h2>Buku Kas</h2><button class="btn" data-add="kas">+ Tambah Mutasi Kas</button></div>${kasRows()}</div>`}
function modal(title,body){document.getElementById('modalbox').innerHTML=`<h3>${title}</h3>${body}`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modalbox').innerHTML=''}
function selectedKK(){return db.masterKk.filter(active).map(x=>`<option value="${x.id}">${esc(x.kodeBuku||x.kodeAnggota||x.kode||'')} — ${esc(x.namaKepalaKeluarga||x.nama)} — ${esc(x.nomorKK||x.nomor||'')}</option>`).join('')}
function formKK(x={}){const rw=rwval(x.rw)||'18',no=x.nomorAnggota||String(db.masterKk.filter(k=>rwval(k.rw)===rw).length+1).padStart(3,'0');modal(x.id?'Edit Master KK':'Tambah Master KK',`<form id="form"><div class="formgrid"><div class="field"><label>Nama Kepala Keluarga *</label><input name="nama" value="${esc(x.namaKepalaKeluarga||x.nama||'')}" required></div><div class="field"><label>No KK *</label><input name="kk" value="${esc(x.nomorKK||x.nomor||'')}" required></div><div class="field"><label>RW</label><select name="rw"><option ${rw==='18'?'selected':''}>18</option><option ${rw==='19'?'selected':''}>19</option><option ${rw==='20'?'selected':''}>20</option></select></div><div class="field"><label>RT</label><input name="rt" value="${esc(x.rt||'01')}"></div><div class="field"><label>No HP</label><input name="hp" value="${esc(x.noHp||x.hp||'')}"></div><div class="field"><label>Status</label><select name="status"><option ${((x.status||'AKTIF')==='AKTIF')?'selected':''}>AKTIF</option><option ${((x.status||'AKTIF')==='NONAKTIF')?'selected':''}>NONAKTIF</option></select></div><div class="field"><label>Kode Buku / Kode Anggota</label><input name="kode" value="${esc(x.kodeBuku||x.kodeAnggota||x.kode||'')}"></div><div class="field"><label>Nomor Anggota</label><input name="no" value="${esc(x.nomorAnggota||no)}"></div><div class="field full"><label>Alamat</label><textarea name="alamat">${esc(x.alamat||x.alamatDetail||'')}</textarea></div></div><div class="footer"><button type="button" class="btn gray" data-close>Batalkan</button><button class="btn" type="submit">Simpan</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const id=x.id||uid();const item={id,...x,namaKepalaKeluarga:d.nama||x.namaKepalaKeluarga||'',nomorKK:d.kk||x.nomorKK||'',rw:d.rw||'18',rt:d.rt||'01',noHp:d.hp||'',status:d.status||'AKTIF',kodeBuku:d.kode||x.kodeBuku||'',kodeAnggota:d.kode||x.kodeAnggota||'',nomorAnggota:d.no||x.nomorAnggota||'',alamat:d.alamat||'',nama:d.nama||x.nama||''};const i=db.masterKk.findIndex(k=>String(k.id)===String(x.id||''));if(i>=0)db.masterKk[i]=item;else db.masterKk.push(item);save();closeModal();render();}} 
function formIuran(){modal('Pencatatan Iuran',`<form id="form"><div class="formgrid"><div class="field full"><label>Kode Buku *</label><input id="kodeBukuInput" name="kodeBuku" type="text" placeholder="Contoh: ISK18/004" required><div id="kkPreview" class="kk-preview"></div><input type="hidden" name="kk" value=""></div><div class="field"><label>Tahun</label><input name="tahun" type="number" value="${new Date().getFullYear()}"></div><div class="field"><label>Triwulan *</label><select name="triwulan" required><option value="Q1">Q1</option><option value="Q2">Q2</option><option value="Q3">Q3</option><option value="Q4">Q4</option></select></div><div class="field"><label>Nominal</label><input name="nominal" type="number" value="25000" min="1" required></div><div class="field"><label>Tanggal</label><input name="tgl" type="date" value="${today()}"></div><div class="field full"><label>Keterangan</label><input name="keterangan" placeholder="Catatan pembayaran"></div></div><div class="footer"><button type="button" class="btn gray" data-close>Batalkan</button><button class="btn" type="submit">Simpan</button></div></form>`);const kodeInput=document.getElementById('kodeBukuInput');const preview=document.getElementById('kkPreview');const kkHidden=document.querySelector('[name="kk"]');const setPreview=()=>{const found=findMasterByKode(kodeInput.value);if(found){const nomor=found.nomorKK||found.nomor||'-';kkHidden.value=found.id;preview.textContent='Nomor KK: '+nomor;preview.style.color='#0e6d4e';}else{kkHidden.value='';preview.textContent='';}};kodeInput.addEventListener('input',setPreview);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const master=findMasterByKode(d.kodeBuku);if(!master){alert('Kode Buku tidak ditemukan di Master KK.');return;}const row={id:uid(),masterKkId:master.id,kodeBuku:master.kodeBuku||master.kodeAnggota||d.kodeBuku,kodeAnggota:master.kodeAnggota||master.kodeBuku||d.kodeBuku,namaKepalaKeluarga:master.namaKepalaKeluarga||master.nama||'',nomorKK:master.nomorKK||master.nomor||'',rw:master.rw||'18',rt:master.rt||'01',tahun:Number(d.tahun||new Date().getFullYear()),triwulan:String(d.triwulan||'Q1').toUpperCase(),nominal:Number(d.nominal||25000),tgl:d.tgl||today(),keterangan:d.keterangan||'',createdAt:new Date().toISOString()};db.iuran.push(row);save();closeModal();render();};}
function formSantunan(){modal('Penyaluran Santunan',`<form id="form"><div class="formgrid"><div class="field full"><label>KK *</label><select name="kk" required>${selectedKK()}</select></div><div class="field"><label>Nama yang Menang</label><input name="nama" required></div><div class="field"><label>Tanggal</label><input name="tgl" type="date" value="${today()}"></div><div class="field"><label>Nominal</label><input name="nominal" type="number" min="1" required></div><div class="field full"><label>Alasan / Keterangan</label><input name="keterangan"></div></div><div class="footer"><button type="button" class="btn gray" data-close>Batalkan</button><button class="btn red" type="submit">Salurkan</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),k=db.masterKk.find(x=>String(x.id)===String(d.kk));if(!k){alert('KK tidak valid.');return;}const row={id:uid(),masterKkId:k.id,kodeAnggota:k.kodeAnggota||k.kodeBuku||k.kode||'',namaKepalaKeluarga:k.namaKepalaKeluarga||k.nama||'',nomorKK:k.nomorKK||k.nomor||'',rw:k.rw||'18',rt:k.rt||'01',namaMeninggal:d.nama||'',tgl:d.tgl||today(),nominal:Number(d.nominal||0),keterangan:d.keterangan||'',createdAt:new Date().toISOString()};db.santunan.push(row);save();closeModal();render();};}

function normalizeRestore(raw){let x=raw;if(x?.data&&typeof x.data==='object'&&!Array.isArray(x.data))x=x.data;else if(x?.database&&typeof x.database==='object')x=x.database;else if(x?.state&&typeof x.state==='object')x=x.state;const arrKeys=['masterKk','iuran','santunan','kas'];const out={masterKk:[],iuran:[],santunan:[],kas:[],settings:{saldoAwal:0}};for(const k of arrKeys){out[k]=Array.isArray(x?.[k])?x[k]:[];}out.settings={saldoAwal:Number(x?.settings?.saldoAwal||0)};return out}

document.getElementById('fileRestore').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const old=localStorage.getItem(KEY);try{const imported=normalizeRestore(JSON.parse(String(r.result||'{}')));const valid=['masterKk','iuran','santunan','kas'];if(!valid.every(k=>Array.isArray(imported[k])))throw new Error('Invalid JSON');db=imported;save();render();alert('Data berhasil dipulihkan.');}catch(err){localStorage.setItem(KEY,old||'');console.error(err);alert('File JSON tidak valid atau tidak sesuai format backup.');}finally{e.target.value='';}};r.onerror=()=>alert('File JSON tidak dapat dibaca.');r.readAsText(f,'utf-8');};
function buildTagihanRows({rw,rt}){const rows=[];const members=db.masterKk.filter(k=>active(k));for(const k of members){const val=rwval(k.rw);if(rw && val!==String(rw))continue;if(rt && String(k.rt||'').trim()!==String(rt))continue;const nextQuarter=determineNextQuarterForKK(k.id);rows.push({kodeBuku:k.kodeBuku||k.kodeAnggota||k.kode||'-',nomorKK:k.nomorKK||k.nomor||'-',namaKepalaKeluarga:k.namaKepalaKeluarga||k.nama||'-',rw:val||'-',rt:k.rt||'-',kuartal:nextQuarter.quarter,year:nextQuarter.year,nominal:25000});}return rows;}
function determineNextQuarterForKK(kkId){
  const now=new Date();
  const currentQuarterName=currentQuarter(now), currentYearNum=now.getFullYear();
  const paid=db.iuran.filter(x=>String(x.masterKkId)===String(kkId));
  let latest={year:currentYearNum-1,quarter:'Q4'};
  for(const p of paid){
    const q=String(p.triwulan||p.quarter||'Q1').toUpperCase();
    if(!quarterOrder.includes(q))continue;
    const y=Number(p.tahun||new Date(p.tgl||Date.now()).getFullYear()||currentYearNum);
    if(!latest || y>latest.year || (y===latest.year && quarterIndex(q)>quarterIndex(latest.quarter))){latest={year:y,quarter:q};}
  }
  const latestIndex=((latest.year-currentYearNum)*4)+quarterIndex(latest.quarter);
  const currentIndex=((currentYearNum-currentYearNum)*4)+quarterIndex(currentQuarterName);
  if(latest.year===currentYearNum && latest.quarter===currentQuarterName){return {year:currentYearNum,quarter:nextQuarter(currentQuarterName)};}
  if(latest.year < currentYearNum || latestIndex < currentIndex){return {year:currentYearNum,quarter:currentQuarterName};}
  return {year:currentYearNum,quarter:nextQuarter(latest.quarter)};
}
function openPrintTagihan(){const rws=[...new Set(db.masterKk.filter(active).map(k=>rwval(k.rw)).filter(Boolean))];const rtOptions=[...new Set(db.masterKk.filter(active).map(k=>String(k.rt||'').trim()).filter(Boolean))];modal('Cetak Buku Tagihan Kuartal Berikutnya',`<form id="tagihanForm"><div class="formgrid"><div class="field"><label>RW</label><select name="rw" id="tagihanRw"><option value="">Semua RW</option>${rws.map(r=>`<option value="${r}">RW ${r}</option>`).join('')}</select></div><div class="field"><label>RT</label><select name="rt" id="tagihanRt"><option value="">Semua RT</option>${rtOptions.map(r=>`<option value="${r}">RT ${r}</option>`).join('')}</select></div></div><div class="footer"><button type="button" class="btn gray" data-close>Batalkan</button><button class="btn gold" type="submit">Cetak</button></div></form>`);document.getElementById('tagihanForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const rows=buildTagihanRows({rw:d.rw,rt:d.rt});if(!rows.length){alert('Tidak ada data warga untuk RW/RT yang dipilih.');return;}printTagihanBook(rows,d.rw,d.rt);};}

  const w=window.open('','_blank'); if(!w) return alert('Popup diblokir. Izinkan popup untuk mencetak laporan.'); w.document.write(body); w.document.close(); setTimeout(()=>w.print(),500);}
