<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f5b"><link rel="icon" href="./logomasjid.png">
<title>SOSKEM DKM Jami Al-Ikhlash</title>
<style>
:root{--g:#087f5b;--bg:#f4f7f6;--ink:#16322b;--muted:#6d7c77;--gold:#b88925;--red:#c0392b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(120deg,#056047,#0b8b66);color:#fff;padding:16px 20px}.brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}.brand img{width:54px;height:54px;object-fit:contain}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;opacity:.86}.wrap{max-width:1100px;margin:20px auto 90px;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce8e3;border-radius:12px;padding:18px;box-shadow:0 4px 16px #16322b0c;margin-bottom:14px}.stat{border-top:4px solid var(--g)}.stat small{display:block;color:var(--muted)}.stat b{font-size:24px;display:block;margin-top:7px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar h2,.card h2{margin:0 0 12px}.btn{border:0;border-radius:7px;padding:9px 13px;background:var(--g);color:white;font-weight:600}.btn.gold{background:var(--gold)}.btn.red{background:var(--red)}.btn.gray{background:#80908b}.btn.light{background:#e7f3ef;color:var(--g)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;margin-top:8px}.table th,.table td{border-bottom:1px solid #e2ebe8;padding:10px 8px;text-align:left;vertical-align:middle}.table th{background:#edf7f3;color:#145342}.table tr:hover td{background:#fbfdfc}.muted{color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d9e5e0;display:flex;justify-content:center;z-index:5}.nav button{background:none;border:0;padding:9px 17px;color:var(--muted);font-size:12px}.nav button.active{color:var(--g);font-weight:700;border-top:3px solid var(--g)}.modal{display:none;position:fixed;inset:0;background:#16322b88;z-index:10;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:12px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-weight:600}.field.full{grid-column:1/-1}.field input,.field select{padding:9px;border:1px solid #c8d8d2;border-radius:6px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.filterbar select{padding:8px;border:1px solid #c8d8d2;border-radius:6px}.actions{display:flex;gap:5px;flex-wrap:wrap}.readonly{background:#f1f6f4;color:#345b50}
</style></head>
<body>
<header class="top"><div class="brand"><img src="./logomasjid.png" alt="Logo Masjid Jami Al-Ikhlash"><div><h1>SOSKEM DKM Jami Al-Ikhlash</h1><p>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</p></div></div></header>
<main id="content" class="wrap"></main>
<nav class="nav"><button data-page="home">⌂<br>Dashboard</button><button data-page="kk">▣<br>Master KK</button><button data-page="iuran">✓<br>Iuran</button><button data-page="tagihan">▤<br>Tagihan</button><button data-page="lainnya">⋯<br>Lainnya</button></nav>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
'use strict';
const KEY='SOSKEM_JAMI_AL_IKHLASH_WEB_V2',empty={masterKk:[],iuran:[],santunan:[],kas:[]};let db=load(),page='home',selectedRw='ALL';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null')||{};return{masterKk:Array.isArray(x.masterKk)?x.masterKk:[],iuran:Array.isArray(x.iuran)?x.iuran:[],santunan:Array.isArray(x.santunan)?x.santunan:[],kas:Array.isArray(x.kas)?x.kas:[]}}catch(e){return JSON.parse(JSON.stringify(empty))}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),id=()=>Date.now()+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),active=k=>k.status!=='NONAKTIF';
function findKode(v){v=String(v||'').trim().toUpperCase().replace(/\s/g,'');return db.masterKk.find(k=>[k.kodeBuku,k.kodeAnggota,k.kode,k.nomorKK,k.nomor].some(x=>String(x||'').toUpperCase().replace(/\s/g,'')===v))}
function rwValues(){return['18','19','20']}
function rwOptions(current=''){return rwValues().map(r=>`<option value="${r}" ${String(current)===r?'selected':''}>RW ${r}</option>`).join('')}
function rwOptionsWithAll(){return ['ALL',...rwValues()].map(r=>`<option value="${r}" ${selectedRw===r?'selected':''}>${r==='ALL'?'Semua RW':'RW '+r}</option>`).join('')}
function filteredRows(){return db.masterKk.filter(active).filter(k=>selectedRw==='ALL'||String(k.rw||'')===selectedRw)}
function stats(){return{kk:db.masterKk.filter(active).length,iuran:db.iuran.reduce((a,x)=>a+(+x.nominal||0),0),kas:db.kas.reduce((a,x)=>a+(x.jenis==='PENGELUARAN'?-(+x.nominal||0):(+x.nominal||0)),0)}}
function render(){const views={home,kk,iuran,tagihan,lainnya};document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=(views[page]||home)();bind()}
function home(){const s=stats();return `<div class="grid"><div class="card stat"><small>KK Aktif</small><b>${s.kk}</b></div><div class="card stat"><small>Total Iuran</small><b>${rupiah(s.iuran)}</b></div><div class="card stat"><small>Saldo Kas</small><b>${rupiah(s.kas)}</b></div><div class="card stat"><small>Data Iuran</small><b>${db.iuran.length}</b></div></div><div class="card"><div class="toolbar"><h2>Dashboard Soskem</h2><button class="btn" data-go="kk">Kelola Master KK</button></div><p class="muted">Gunakan menu untuk mengelola data warga, iuran, dan mencetak buku tagihan.</p></div>`}
function kk(){return `<div class="card"><div class="toolbar"><h2>Master KK</h2><button class="btn" data-add="kk">+ Tambah KK</button></div><div class="tablewrap"><table class="table"><tr><th>Nama</th><th>Kode Buku</th><th>No KK</th><th>RW/RT</th><th>Aksi</th></tr>${db.masterKk.filter(active).map(k=>`<tr><td>${esc(k.nama||k.namaKepalaKeluarga)}</td><td>${esc(k.kodeBuku||k.kodeAnggota||k.kode)}</td><td>${esc(k.nomorKK||k.nomor)}</td><td>${esc(k.rw||'-')}/${esc(k.rt||'-')}</td><td class="actions"><button class="btn light" data-edit="${k.id}">Edit</button><button class="btn red" data-delete="${k.id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Belum ada data.</td></tr>'}</table></div></div>`}
function iuran(){return `<div class="card"><div class="toolbar"><h2>Pembayaran Iuran</h2><button class="btn" data-add="iuran">+ Catat Iuran</button></div><div class="tablewrap"><table class="table"><tr><th>Kode</th><th>Nama</th><th>Kuartal</th><th>Nominal</th></tr>${db.iuran.slice().reverse().map(x=>`<tr><td>${esc(x.kode)}</td><td>${esc(x.nama)}</td><td>${esc(x.quarter)}</td><td>${rupiah(x.nominal)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Belum ada pembayaran.</td></tr>'}</table></div></div>`}
function tagihan(){return `<div class="card"><h2>Cetak Tagihan</h2><p class="muted">Pilih wilayah RW sebelum mencetak. Filter berlaku untuk kedua jenis cetakan.</p><div class="filterbar"><label>Wilayah RW <select id="rwFilter"><option value="ALL" ${selectedRw==='ALL'?'selected':''}>Semua RW</option>${rwOptionsWithAll().replace(/<option value="ALL"[^>]*>Semua RW<\/option>/,'')}</select></label><span class="muted">${filteredRows().length} KK terpilih</span></div><div class="toolbar"><button class="btn gold" data-print>🖨️ Cetak Buku Tagihan</button><button class="btn" data-print-next>🖨️ Cetak Tagihan Berikutnya</button></div></div>`}
function lainnya(){return `<div class="grid"><div class="card"><h2>Backup Data</h2><div class="actions"><button class="btn" data-backup>Unduh JSON</button><button class="btn light" data-restore>↥ Pulihkan / Restore JSON</button><input id="restoreFile" type="file" accept="application/json" hidden></div><p class="muted">Simpan atau pulihkan seluruh data aplikasi.</p></div><div class="card"><h2>Rekapitulasi Iuran</h2><p class="muted">Lihat dan cetak ringkasan pembayaran berdasarkan wilayah.</p><button class="btn gold" data-rekap>▤ Buka Rekapitulasi</button></div><div class="card"><h2>Informasi</h2><p class="muted">Data disimpan lokal di perangkat ini.</p></div></div>`}
function modal(title,body){document.getElementById('modalbox').innerHTML=`<h3>${title}</h3>${body}`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function formKK(k){k=k||{};const oldCode=k.kodeBuku||k.kode||'';const match=oldCode.match(/^(ISK(?:18|19|20))\/?(.*)$/i),prefix=match?match[1].toUpperCase():'ISK18',number=match?match[2]:oldCode;modal(k.id?'Edit Master KK':'Tambah Master KK',`<form id="form"><div class="formgrid"><label class="field">Nama<input name="nama" value="${esc(k.nama||k.namaKepalaKeluarga||'')}" required></label><label class="field">Kode Buku<select name="prefix"><option ${prefix==='ISK18'?'selected':''}>ISK18</option><option ${prefix==='ISK19'?'selected':''}>ISK19</option><option ${prefix==='ISK20'?'selected':''}>ISK20</option></select><input name="bookNumber" value="${esc(number)}" placeholder="Nomor, contoh 001" required></label><label class="field">Nomor KK<input name="nomorKK" value="${esc(k.nomorKK||k.nomor||'')}"></label><label class="field">RW<select name="rw">${rwOptions(k.rw||'18')}</select></label><label class="field">RT<input name="rt" value="${esc(k.rt||'01')}"></label></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.kode=`${d.prefix}/${d.bookNumber}`;delete d.prefix;delete d.bookNumber;if(k.id)Object.assign(k,d,{namaKepalaKeluarga:d.nama,kodeBuku:d.kode});else db.masterKk.push({id:id(),...d,namaKepalaKeluarga:d.nama,kodeBuku:d.kode});save();closeModal();render()}}
function codesForRw(rw){return db.masterKk.filter(active).filter(k=>String(k.rw||'')===String(rw)).sort((a,b)=>String(a.kodeBuku||a.kode||'').localeCompare(String(b.kodeBuku||b.kode||'')))}
function codeOptions(rw){const rows=codesForRw(rw);return rows.map(k=>`<option value="${esc(k.kodeBuku||k.kode||k.kodeAnggota||'')}">${esc(k.kodeBuku||k.kode||k.kodeAnggota||'')} — ${esc(k.nama||k.namaKepalaKeluarga||'-')}</option>`).join('')}
function addIuran(){const defaultRw='18';modal('Catat Iuran',`<form id="form"><div class="formgrid"><label class="field">Wilayah RW<select id="iuranRw" name="rw">${rwOptions(defaultRw)}</select></label><label class="field">Kode Buku / Nomor KK<select id="kode" name="kode" required>${codeOptions(defaultRw)||'<option value="">Belum ada Master KK di RW ini</option>'}</select><small id="preview" class="muted"></small></label><label class="field">Kuartal<select name="quarter"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></label><label class="field">Nominal Iuran (Rp)<input name="nominal" type="number" value="25000" required></label></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);const rw=document.getElementById('iuranRw'),code=document.getElementById('kode'),preview=document.getElementById('preview');const refreshCodes=()=>{const opts=codeOptions(rw.value);code.innerHTML=opts||'<option value="">Belum ada Master KK di RW ini</option>';updatePreview()};const updatePreview=()=>{const k=findKode(code.value);preview.textContent=k?`Ditemukan — Nama: ${k.nama||k.namaKepalaKeluarga||'-'} | RW ${k.rw||'-'}`:'Pilih kode buku';};rw.onchange=refreshCodes;code.onchange=updatePreview;refreshCodes();document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),k=findKode(d.kode);if(!k||String(k.rw)!==String(d.rw))return alert('Kode Buku tidak sesuai dengan wilayah RW yang dipilih.');db.iuran.push({id:id(),kode:k.kodeBuku||k.kode,nama:k.nama||k.namaKepalaKeluarga,quarter:d.quarter,nominal:+d.nominal,rw:d.rw});save();closeModal();render()}}
function printPage(title,rows,sub){const w=window.open('','_blank');if(!w)return alert('Popup diblokir. Izinkan popup untuk mencetak.');w.document.write(`<html><head><title>${esc(title)}</title><style>@page{size:A4;margin:15mm}body{font:12px Arial;color:#18352d;margin:0}.kop{display:flex;align-items:center;border-bottom:3px solid #087f5b;padding-bottom:12px;margin-bottom:14px}.kop img{width:60px;height:60px;object-fit:contain;margin-right:14px}.kop h1{font-size:18px;color:#087f5b;margin:0 0 4px}.kop p{margin:0;color:#58736a}.meta{background:#edf7f3;border-left:4px solid #b88925;padding:8px;margin-bottom:14px}.table{width:100%;border-collapse:collapse}.table th{background:#087f5b;color:#fff}.table th,.table td{border:1px solid #9eb9ae;padding:7px;text-align:left}.table tr:nth-child(even){background:#f3f8f6}.num{text-align:center}.money{text-align:right}.check{text-align:center;width:55px}.manual{height:26px;min-width:75px;border:0;border-bottom:1px solid #18352d;background:transparent}.foot{margin-top:20px;color:#58736a;border-top:1px solid #cbdcd5;padding-top:8px}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.manual{border-bottom:1px solid #18352d}}</style></head><body><div class="kop"><img src="${location.href.replace(/index\.html.*$/,'')}logomasjid.png"><div><h1>DKM JAMI AL-IKHLASH</h1><p>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</p></div></div><div class="meta"><b>${esc(title)}</b><br>${esc(sub)} • Dicetak ${new Date().toLocaleDateString('id-ID')}</div><table class="table"><tr><th>No</th><th>Nama</th><th>Kode Buku / Kode KK</th><th>RW/RT</th><th>Nominal Iuran<br>(Rp 25.000)</th><th>Infaq (Rp)</th></tr>${rows.map((k,i)=>`<tr><td class="num">${i+1}</td><td>${esc(k.nama||k.namaKepalaKeluarga)}</td><td>${esc(k.kodeBuku||k.kode||k.nomorKK||'-')}</td><td>${esc(k.rw||'-')}/${esc(k.rt||'-')}</td><td class="money"><label><input type="checkbox"> &nbsp;25.000</label></td><td><input class="manual" aria-label="Nominal infaq"></td></tr>`).join('')}</table><div class="foot">Dokumen ini dibuat oleh aplikasi SOSKEM DKM Jami Al-Ikhlash.</div></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function printTagihan(){printPage('Buku Tagihan Soskem',filteredRows(),selectedRw==='ALL'?'Semua wilayah':`Wilayah RW ${selectedRw}`)}
function printTagihanKuartalBerikutnya(){const m=new Date().getMonth()+1,q=m<=3?'Q1':m<=6?'Q2':m<=9?'Q3':'Q4',next='Q'+(Number(q[1])%4+1);printPage('Tagihan Kuartal Berikutnya',filteredRows(),`${selectedRw==='ALL'?'Semua wilayah':`Wilayah RW ${selectedRw}`} • ${next}`)}
function printRekap(rw){const rows=db.iuran.filter(x=>rw==='ALL'||String(x.rw||'')===String(rw));const groups={};rows.forEach(x=>{const key=`${x.quarter||'-'} • RW ${x.rw||'-'}`;groups[key]=(groups[key]||0)+(+x.nominal||0)});const list=Object.entries(groups).map(([key,total])=>({key,total}));const w=window.open('','_blank');if(!w)return alert('Popup diblokir. Izinkan popup untuk mencetak.');w.document.write(`<html><head><title>Rekapitulasi Iuran</title><style>@page{size:A4;margin:15mm}body{font:13px Arial;color:#18352d}.kop{border-bottom:3px solid #087f5b;padding:10px 0}.kop h1{color:#087f5b;margin:0}.meta{margin:16px 0;padding:10px;background:#edf7f3;border-left:4px solid #b88925}table{width:100%;border-collapse:collapse}th,td{border:1px solid #9eb9ae;padding:9px;text-align:left}th{background:#087f5b;color:white}td:last-child{text-align:right}.total{font-weight:bold;background:#f3f8f6}</style></head><body><div class="kop"><h1>DKM JAMI AL-IKHLASH</h1><div>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</div></div><div class="meta"><b>Rekapitulasi Iuran</b><br>${rw==='ALL'?'Semua wilayah':`Wilayah RW ${esc(rw)}`} • Dicetak ${new Date().toLocaleDateString('id-ID')}</div><table><tr><th>Periode / Wilayah</th><th>Total Iuran</th></tr>${list.map(x=>`<tr><td>${esc(x.key)}</td><td>${rupiah(x.total)}</td></tr>`).join('')||'<tr><td colspan="2">Belum ada data iuran.</td></tr>'}<tr class="total"><td>Grand Total</td><td>${rupiah(rows.reduce((a,x)=>a+(+x.nominal||0),0))}</td></tr></table></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function showRekap(){modal('Rekapitulasi Iuran',`<div class="filterbar"><label>Wilayah RW <select id="rekapRw"><option value="ALL">Semua RW</option>${rwOptions()}</select></label></div><div id="rekapPreview"></div><div class="footer"><button type="button" class="btn gray" data-close>Tutup</button><button type="button" class="btn gold" data-print-rekap>🖨️ Cetak Rekap</button></div>`);const select=document.getElementById('rekapRw'),preview=document.getElementById('rekapPreview');const update=()=>{const rw=select.value,rows=db.iuran.filter(x=>rw==='ALL'||String(x.rw||'')===rw),groups={};rows.forEach(x=>{const key=`${x.quarter||'-'} • RW ${x.rw||'-'}`;groups[key]=(groups[key]||0)+(+x.nominal||0)});preview.innerHTML=`<table class="table"><tr><th>Periode / Wilayah</th><th>Total</th></tr>${Object.entries(groups).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${rupiah(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">Belum ada data iuran.</td></tr>'}</table>`};select.onchange=update;document.querySelector('[data-print-rekap]').onclick=()=>printRekap(select.value);update()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-add="kk"]').forEach(b=>b.onclick=()=>formKK());document.querySelectorAll('[data-add="iuran"]').forEach(b=>b.onclick=addIuran);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>formKK(db.masterKk.find(k=>String(k.id)===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Hapus permanen data master KK ini?')){db.masterKk=db.masterKk.filter(k=>String(k.id)!==b.dataset.delete);save();render()}});const rf=document.getElementById('rwFilter');if(rf)rf.onchange=()=>{selectedRw=rf.value;render()};document.querySelector('[data-print]')?.addEventListener('click',printTagihan);document.querySelector('[data-print-next]')?.addEventListener('click',printTagihanKuartalBerikutnya);document.querySelector('[data-backup]')?.addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-soskem.json';a.click()});document.querySelector('[data-restore]')?.addEventListener('click',()=>document.getElementById('restoreFile').click());document.getElementById('restoreFile')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.masterKk)||!Array.isArray(x.iuran))throw Error();db={...empty,...x};save();render();alert('Data berhasil dipulihkan.')}catch(err){alert('File JSON tidak valid.')}};r.readAsText(f)});document.querySelector('[data-rekap]')?.addEventListener('click',showRekap)}
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){e.preventDefault();closeModal()}if(e.target===document.getElementById('modal'))closeModal()});
render();
</script></body></html>
