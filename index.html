<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOSKEM DKM Jami Al-Ikhlash</title><style>:root{--g:#087f5b;--bg:#f4f7f6;--ink:#16322b;--muted:#6d7c77;--gold:#b88925;--red:#c0392b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(120deg,#056047,#0b8b66);color:#fff;padding:16px 20px}.brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}.brand img{width:54px;height:54px;object-fit:contain}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0;opacity:.86}.wrap{max-width:1100px;margin:20px auto 90px;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce8e3;border-radius:12px;padding:18px;box-shadow:0 4px 16px #16322b0c;margin-bottom:14px}.stat{border-top:4px solid var(--g)}.stat small{color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:7px}.toolbar,.actions,.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{justify-content:space-between}.btn{border:0;border-radius:7px;padding:9px 13px;background:var(--g);color:#fff;font-weight:600}.btn.gold{background:var(--gold)}.btn.red{background:var(--red)}.btn.gray{background:#80908b}.btn.light{background:#e7f3ef;color:var(--g)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #e2ebe8;padding:10px 8px;text-align:left}.table th{background:#edf7f3;color:#145342}.muted{color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d9e5e0;display:flex;justify-content:center;z-index:5}.nav button{background:none;border:0;padding:9px 17px;color:var(--muted);font-size:12px}.nav button.active{color:var(--g);font-weight:700;border-top:3px solid var(--g)}.modal{display:none;position:fixed;inset:0;background:#16322b88;z-index:10;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:12px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-weight:600}.field input,.field select{padding:9px;border:1px solid #c8d8d2;border-radius:6px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}</style></head><body><header class="top"><div class="brand"><img src="./logomasjid.png" alt="Logo"><div><h1>SOSKEM DKM Jami Al-Ikhlash</h1><p>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</p></div></div></header><main id="content" class="wrap"></main><nav class="nav"><button data-page="home">⌂<br>Dashboard</button><button data-page="kk">▣<br>Master KK</button><button data-page="iuran">✓<br>Iuran</button><button data-page="tagihan">▤<br>Tagihan</button><button data-page="lainnya">⋯<br>Lainnya</button></nav><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><script>'use strict';const KEY='SOSKEM_JAMI_AL_IKHLASH_WEB_V2',empty={masterKk:[],iuran:[],santunan:[],kas:[]};let db=load(),page='home',selectedRw='ALL';function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null')||{};return{masterKk:Array.isArray(x.masterKk)?x.masterKk:[],iuran:Array.isArray(x.iuran)?x.iuran:[],santunan:Array.isArray(x.santunan)?x.santunan:[],kas:Array.isArray(x.kas)?x.kas:[]}}catch(e){return JSON.parse(JSON.stringify(empty))}}const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),id=()=>Date.now()+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+n||0),active=k=>k.status!=='NONAKTIF';function rwValues(){return['18','19','20']}function rwOptions(v=''){return rwValues().map(r=>`<option value="${r}" ${String(v)===r?'selected':''}>RW ${r}</option>`).join('')}function findKode(v){v=String(v||'').replace(/\s/g,'').toUpperCase();return db.masterKk.find(k=>[k.kodeBuku,k.kode,k.kodeAnggota,k.nomorKK,k.nomor].some(x=>String(x||'').replace(/\s/g,'').toUpperCase()===v))}function rows(){return db.masterKk.filter(active).filter(k=>selectedRw==='ALL'||String(k.rw)===selectedRw)}function render(){let v={home,kk,iuran,tagihan,lainnya};document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=(v[page]||home)();bind()}function home(){let s={kk:db.masterKk.filter(active).length,i:db.iuran.reduce((a,x)=>a+(+x.nominal||0),0)};return `<div class="grid"><div class="card stat"><small>KK Aktif</small><b>${s.kk}</b></div><div class="card stat"><small>Total Iuran</small><b>${rupiah(s.i)}</b></div></div><div class="card"><h2>Dashboard Soskem</h2><p class="muted">Kelola data warga, iuran, dan cetak tagihan.</p></div>`}function kk(){return `<div class="card"><div class="toolbar"><h2>Master KK</h2><button class="btn" data-add="kk">+ Tambah KK</button></div><div class="tablewrap"><table class="table"><tr><th>Nama</th><th>Kode Buku</th><th>No KK</th><th>RW/RT</th><th>Aksi</th></tr>${db.masterKk.filter(active).map(k=>`<tr><td>${esc(k.nama||k.namaKepalaKeluarga)}</td><td>${esc(k.kodeBuku||k.kode)}</td><td>${esc(k.nomorKK||k.nomor)}</td><td>${esc(k.rw||'-')}/${esc(k.rt||'-')}</td><td><button class="btn light" data-edit="${k.id}">Edit</button> <button class="btn red" data-delete="${k.id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada data.</td></tr>'}</table></div></div>`}function iuran(){return `<div class="card"><div class="toolbar"><h2>Pembayaran Iuran</h2><button class="btn" data-add="iuran">+ Catat Iuran</button></div><table class="table"><tr><th>Kode</th><th>Nama</th><th>Kuartal</th><th>Nominal</th></tr>${db.iuran.slice().reverse().map(x=>`<tr><td>${esc(x.kode)}</td><td>${esc(x.nama||'-')}</td><td>${esc(x.quarter)}</td><td>${rupiah(x.nominal)}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada pembayaran.</td></tr>'}</table></div>`}function tagihan(){return `<div class="card"><h2>Cetak Tagihan</h2><div class="filterbar"><label>Wilayah RW <select id="rwFilter"><option value="ALL">Semua RW</option>${rwValues().map(r=>`<option value="${r}" ${selectedRw===r?'selected':''}>RW ${r}</option>`).join('')}</select></label><button class="btn gold" data-print>Cetak Buku Tagihan</button><button class="btn" data-print-next>Cetak Berikutnya</button></div></div>`}function lainnya(){return `<div class="grid"><div class="card"><h2>Backup Data</h2><button class="btn" data-backup>Unduh JSON</button> <button class="btn light" data-restore>Pulihkan / Restore JSON</button><input id="restoreFile" type="file" accept="application/json" hidden></div><div class="card"><h2>Rekapitulasi Iuran</h2><button class="btn gold" data-rekap>Buka Rekapitulasi</button></div></div>`}function modal(t,b){document.getElementById('modalbox').innerHTML=`<h3>${t}</h3>${b}`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function formKK(k={}){let old=k.kodeBuku||k.kode||'',m=old.match(/^(ISK18|ISK19|ISK20)\/?(.*)$/i)||[];modal(k.id?'Edit Master KK':'Tambah Master KK',`<form id="form"><div class="formgrid"><label class="field">Nama<input name="nama" value="${esc(k.nama||k.namaKepalaKeluarga||'')}" required></label><label class="field">Kode Buku<select name="prefix"><option>ISK18</option><option>ISK19</option><option>ISK20</option></select><input name="number" value="${esc(m[2]||'')}" required></label><label class="field">Nomor KK<input name="nomorKK" value="${esc(k.nomorKK||'')}"></label><label class="field">RW<select name="rw">${rwOptions(k.rw||'18')}</select></label><label class="field">RT<input name="rt" value="${esc(k.rt||'01')}"></label></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);document.querySelector('[name=prefix]').value=m[1]||'ISK18';document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.kode=`${d.prefix}/${d.number}`;delete d.prefix;delete d.number;if(k.id)Object.assign(k,d,{kodeBuku:d.kode,namaKepalaKeluarga:d.nama});else db.masterKk.push({id:id(),...d,kodeBuku:d.kode,namaKepalaKeluarga:d.nama});save();closeModal();render()}}function addIuran(){modal('Catat Iuran',`<form id="form"><div class="formgrid"><label class="field">Wilayah RW<select id="iuranRw" name="rw">${rwOptions('18')}</select></label><label class="field">Kode Buku / Nomor KK<div style="display:flex;gap:0;align-items:center"><span id="kodePrefix" style="padding:9px;border:1px solid #c8d8d2;border-right:0;border-radius:6px 0 0 6px;background:#f1f6f4;color:#345b50">ISK18/</span><input id="kodeNumber" name="kodeNumber" inputmode="numeric" placeholder="XXX / nomor buku" required style="border-radius:0 6px 6px 0"></div><small class="muted">Prefix otomatis mengikuti RW; petugas cukup mengisi nomor kartu/buku.</small></label><label class="field">Kuartal<select name="quarter"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></label><label class="field">Nominal Iuran (Rp)<input name="nominal" type="number" value="25000" required></label></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);let rw=document.getElementById('iuranRw'),prefix=document.getElementById('kodePrefix');rw.onchange=()=>prefix.textContent='ISK'+rw.value+'/';document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),number=d.kodeNumber.trim();if(!number)return alert('Nomor buku wajib diisi.');db.iuran.push({id:id(),kode:'ISK'+d.rw+'/'+number,nama:'',quarter:d.quarter,nominal:+d.nominal,rw:d.rw});save();closeModal();render()}}function printPage(title,data,sub){let w=open('','_blank');if(!w)return alert('Popup diblokir.');w.document.write(`<html><head><title>${title}</title><style>body{font:12px Arial;color:#18352d}table{width:100%;border-collapse:collapse}th,td{border:1px solid #9eb9ae;padding:7px}th{background:#087f5b;color:#fff}.check{text-align:center}.manual{border:0;border-bottom:1px solid #18352d}</style></head><body><h2>DKM JAMI AL-IKHLASH</h2><p>${title} — ${sub}</p><table><tr><th>No</th><th>Nama</th><th>Kode Buku / Kode KK</th><th>RW/RT</th><th>Nominal Iuran (Rp25.000)</th><th>Infaq</th></tr>${data.map((k,i)=>`<tr><td>${i+1}</td><td>${esc(k.nama||k.namaKepalaKeluarga||'-')}</td><td>${esc(k.kodeBuku||k.kode||'-')}</td><td>${k.rw||'-'}/${k.rt||'-'}</td><td class="check"><input type="checkbox"> 25.000</td><td><input class="manual"></td></tr>`).join('')}</table></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}function showRekap(){modal('Rekapitulasi Iuran',`<label class="field">Wilayah RW<select id="rekapRw"><option value="ALL">Semua RW</option>${rwValues().map(r=>`<option value="${r}">RW ${r}</option>`).join('')}</select></label><div id="preview"></div><div class="footer"><button class="btn gray" data-close>Tutup</button><button class="btn gold" data-print-rekap>Cetak Rekap</button></div>`);let s=document.getElementById('rekapRw'),p=document.getElementById('preview');function update(){let a=db.iuran.filter(x=>s.value==='ALL'||String(x.rw)===s.value),g={};a.forEach(x=>g[x.quarter+' • RW '+x.rw]=(g[x.quarter+' • RW '+x.rw]||0)+(+x.nominal||0));p.innerHTML='<table class="table"><tr><th>Periode/Wilayah</th><th>Total</th></tr>'+Object.entries(g).map(x=>`<tr><td>${x[0]}</td><td>${rupiah(x[1])}</td></tr>`).join('')+'</table>'}s.onchange=update;document.querySelector('[data-print-rekap]').onclick=()=>{let a=db.iuran.filter(x=>s.value==='ALL'||String(x.rw)===s.value);printPage('Rekapitulasi Iuran',a,s.value==='ALL'?'Semua RW':'RW '+s.value)};update()}function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelector('[data-add="kk"]')?.addEventListener('click',()=>formKK());document.querySelector('[data-add="iuran"]')?.addEventListener('click',addIuran);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>formKK(db.masterKk.find(k=>String(k.id)===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Hapus permanen?')){db.masterKk=db.masterKk.filter(k=>String(k.id)!==b.dataset.delete);save();render()}});document.getElementById('rwFilter')?.addEventListener('change',e=>{selectedRw=e.target.value;render()});document.querySelector('[data-print]')?.addEventListener('click',()=>printPage('Buku Tagihan Soskem',rows(),selectedRw==='ALL'?'Semua RW':'RW '+selectedRw));document.querySelector('[data-print-next]')?.addEventListener('click',()=>printPage('Tagihan Berikutnya',rows(),selectedRw==='ALL'?'Semua RW':'RW '+selectedRw));document.querySelector('[data-rekap]')?.addEventListener('click',showRekap);document.querySelector('[data-backup]')?.addEventListener('click',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-soskem.json';a.click()});document.querySelector('[data-restore]')?.addEventListener('click',()=>document.getElementById('restoreFile').click());document.getElementById('restoreFile')?.addEventListener('change',e=>{let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);db={...empty,...x};save();render();alert('Data berhasil dipulihkan')}catch(_){alert('JSON tidak valid')}};r.readAsText(e.target.files[0])})}document.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===document.getElementById('modal'))closeModal()});render();</script></body></html>
