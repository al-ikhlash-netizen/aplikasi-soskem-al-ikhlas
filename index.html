</style></head><body><header class="top"><button id="installBtn" class="btn gold" style="display:none;position:absolute;right:12px;top:12px" type="button">⬇ Instal App</button><div class="brand"><img src="./logomasjid.png" alt="Logo Masjid Jami Al-Ikhlash"><div><h1>SOSKEM DKM Jami Al-Ikhlash</h1><p>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</p></div></div></header><main class="wrap" id="content"></main><div class="bottom"><nav class="nav"><button data-page="home"><i>⌂</i>Dashboard</button><button data-page="kk"><i>▣</i>Master KK</button><button data-page="iuran"><i>✓</i>Iuran</button><button data-page="santunan"><i>♥</i>Santunan</button><button data-page="lainnya"><i>☷</i>Lainnya</button></nav></div><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modalbox" id="modalbox"></div></div><input id="fileRestore" type="file" accept="application/json,.json" class="hidden"><script>
const KEY='SOSKEM_JAMI_AL_IKHLASH_WEB_V2',EMPTY={masterKk:[],iuran:[],santunan:[],kas:[],settings:{saldoAwal:0}};let page='home',db=load();
const clone=x=>JSON.parse(JSON.stringify(x)),load=()=>{try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?{...clone(EMPTY),...x,settings:{...EMPTY.settings,...(x.settings||{})}}:clone(EMPTY)}catch(e){return clone(EMPTY)}},save=()=>localStorage.setItem(KEY,JSON.stringify(db)),uid=()=>Date.now()+Math.floor(Math.random()*999),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),rwval=r=>String(r??'').replace(/^RW\s*/i,'').trim(),code=(rw,no)=>`ISK${rwval(rw)}/${String(no??'').trim()}`;
function stats(){let inx=db.kas.filter(x=>x.jenis==='PEMASUKAN').reduce((a,x)=>a+(+x.nominal||0),0),out=db.kas.filter(x=>x.jenis==='PENGELUARAN').reduce((a,x)=>a+(+x.nominal||0),0);return{kk:db.masterKk.filter(x=>x.status!=='NONAKTIF'&&x.statusKalkulasi!=='NONAKTIF').length,iuran:db.iuran.reduce((a,x)=>a+(+x.nominal||0),0),santunan:db.santunan.reduce((a,x)=>a+(+x.nominal||0),0),masuk:inx,keluar:out,saldo:(+db.settings.saldoAwal||0)+inx-out}}

function home(){let s=stats();return `<div class="grid"><div class="card stat"><small>Total KK Aktif</small><b>${s.kk}</b><span class="muted">Master keluarga</span></div><div class="card stat"><small>Total Iuran</small><b>${rupiah(s.iuran)}</b></div><div class="card stat"><small>Santunan Disalurkan</small><b>${rupiah(s.santunan)}</b></div><div class="card stat"><small>Saldo Kas</small><b>${rupiah(s.saldo)}</b></div></div><div class="section card"><div class="toolbar"><h2>Wilayah</h2><div class="actions"><button class="btn" data-go="kk">Master KK</button><button class="btn gold" data-go="kas">Buku Kas</button></div></div><div class="rwgrid">${['18','19','20'].map(r=>`<div class="rw"><small>RW ${r}</small><b>${db.masterKk.filter(x=>rwval(x.rw)===r&&x.status!=='NONAKTIF').length}</b><span class="muted">KK aktif</span></div>`).join('')}</div></div><div class="section card"><h2>Mutasi Kas Terbaru</h2>${db.kas.length?`<div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Nominal</th><th>Keterangan</th></tr>${db.kas.slice().reverse().slice(0,8).map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.jenis)}</td><td>${esc(x.kategori)}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.keterangan||x.deskripsi)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada mutasi transaksi kas.</div>'}</div>`}

function iuran(){return `<div class="card"><div class="toolbar"><div><h2>Pembayaran Iuran</h2><span class="muted">Pencatatan per tahun dan kuartal</span></div><button class="btn" data-add="iuran">+ Catat Iuran</button></div><div class="tablewrap">${db.iuran.length?`<table class="table"><tr><th>ISK / Keluarga</th><th>No KK</th><th>RW/RT</th><th>Tahun</th><th>Triwulan</th><th>Nominal</th><th>Tanggal</th><th>Catatan</th></tr>${db.iuran.slice().reverse().map(x=>`<tr><td><b>${esc(x.kodeAnggota||x.kode)}</b><br>${esc(x.namaKepalaKeluarga||'-')}</td><td>${esc(x.nomorKK||'-')}</td><td>${esc(rwval(x.rw))}/${esc(x.rt||'-')}</td><td>${esc(x.tahun||x.year||'-')}</td><td>${esc(x.periode||['q1','q2','q3','q4'].filter(k=>x[k]).map(k=>k.toUpperCase()).join(', ')||'-')}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.tanggalPembayaran||x.tanggal)}</td><td>${esc(x.catatan||x.notes||'')}</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada pencatatan iuran.</div>'}</div></div>`}

function kas(){return `<div class="grid">${[['Saldo Awal',db.settings.saldoAwal],['Pemasukan',stats().masuk],['Pengeluaran',stats().keluar],['Saldo',stats().saldo]].map(x=>`<div class="card stat"><small>${x[0]}</small><b>${rupiah(x[1])}</b></div>`).join('')}</div><div class="section card"><div class="toolbar"><h2>Buku Kas SOSKEM</h2><button class="btn" data-add="kas">+ Tambah Mutasi</button></div><div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Nominal</th><th>Keterangan</th><th>Aksi</th></tr>${db.kas.slice().reverse().map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.jenis)}</td><td>${esc(x.kategori)}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.keterangan||x.deskripsi)}</td><td><button class="btn red" data-kasdel="${x.id}">Hapus</button></td></tr>`).join('')}</table></div></div>`}
function lainnya(){return `<div class="grid"><div class="card"><h2>▣ Buku Kas</h2><button class="btn" data-go="kas">Buka Buku Kas</button></div><div class="card"><h2>▤ Laporan</h2><button class="btn blue" data-report>Pratinjau Laporan</button></div><div class="card"><h2>⇄ Backup & Restore</h2><button class="btn gold" data-backup>Backup JSON</button> <button class="btn gray" data-restore>Restore</button></div><div class="card"><h2>⚙ Pengaturan</h2><button class="btn gray" data-settings>Pengaturan</button></div></div><div class="section card"><p>SOSKEM DKM Jami Al-Ikhlash • RW 18, RW 19, RW 20.</p><div class="notice">Data tersimpan lokal pada perangkat/browser.</div></div>`}
function modal(title,body){document.getElementById('modalbox').innerHTML=`<h3>${title}</h3>${body}`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modalbox').replaceChildren()}
function formKK(x={}){let editing=!!x.id, rw=rwval(x.rw)||'18',no=x.nomorAnggota||String((db.masterKk.filter(k=>rwval(k.rw)===rw).length+1)).padStart(3,'0');modal(editing?'Edit Master KK':'Tambah Master KK',`<form id="form"><div class="formgrid"><div class="field"><label>Nama Kepala Keluarga *</label><input name="nama" required value="${esc(x.namaKepalaKeluarga||x.nama)}"></div><div class="field"><label>Nomor KK</label><input name="kk" maxlength="16" value="${esc(x.nomorKK||x.nomor)}"></div><div class="field"><label>RW *</label><select name="rw"><option ${rw==='18'?'selected':''}>18</option><option ${rw==='19'?'selected':''}>19</option><option ${rw==='20'?'selected':''}>20</option></select></div><div class="field"><label>RT</label><input name="rt" value="${esc(x.rt||'01')}"></div><div class="field"><label>Nomor Anggota *</label><input name="no" required value="${esc(no)}"><small class="muted">Kode otomatis: ISK + RW / Nomor</small></div><div class="field"><label>Kode ISK</label><input value="${esc(x.kodeAnggota||x.kodeBuku||x.kode||code(rw,no))}" readonly></div><div class="field"><label>Status</label><select name="status"><option ${!(x.status==='NONAKTIF'||x.statusKalkulasi==='NONAKTIF')?'selected':''}>AKTIF</option><option ${(x.status==='NONAKTIF'||x.statusKalkulasi==='NONAKTIF')?'selected':''}>NONAKTIF</option></select></div><div class="field"><label>No HP / WhatsApp</label><input name="hp" value="${esc(x.noHp||x.phone)}"></div><div class="field"><label>Tanggal Terdaftar</label><input name="tgl" type="date" value="${esc(x.tanggalTerdaftar||x.tanggal||today())}"></div><div class="field full"><label>Alamat</label><textarea name="alamat">${esc(x.alamatDetail||x.alamat)}</textarea></div></div><div class="footer-actions"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan Data</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),c=code(d.rw,d.no),duplicate=db.masterKk.some(k=>k.id!==x.id&&(k.kodeAnggota||k.kodeBuku||k.kode)===c);if(duplicate){alert('Kode ISK tersebut sudah digunakan pada RW dan nomor anggota yang sama.');return}let item={...x,id:x.id||uid(),nomorKK:d.kk,namaKepalaKeluarga:d.nama,rw:d.rw,rt:d.rt,nomorAnggota:d.no,kodeAnggota:c,kodeBuku:c,status:d.status,tanggalTerdaftar:d.tgl,noHp:d.hp,alamatDetail:d.alamat};let i=db.masterKk.findIndex(k=>k.id===item.id);i<0?db.masterKk.push(item):db.masterKk[i]=item;save();closeModal();render()}}
function selectedKK(){return db.masterKk.filter(x=>x.status!=='NONAKTIF').map(x=>`<option value="${x.id}">${esc(x.kodeAnggota||x.kode)} — ${esc(x.namaKepalaKeluarga||x.nama)} — ${esc(x.nomorKK||x.nomor||'')}</option>`).join('')}
function formIuran(){modal('Pencatatan Iuran SOSKEM',`<form id="form"><div class="formgrid"><div class="field full"><label>Pilih KK *</label><select name="kk" required>${selectedKK()}</select></div><div class="field"><label>Tahun</label><input name="tahun" type="number" value="2026"></div><div class="field"><label>Nominal</label><input name="nominal" type="number" min="0" required></div><div class="field full"><label>Kuartal / Periode</label><input name="periode" placeholder="Triwulan 2 (Apr-Jun)"></div><div class="field"><label>Tanggal Bayar</label><input name="tgl" type="date" value="${today()}"></div><div class="field"><label>Catatan</label><input name="catatan"></div></div><div class="footer-actions"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan & Masuk Kas</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),k=db.masterKk.find(x=>x.id==d.kk),id=uid(),kid=uid(),item={id,masterKkId:k.id,kodeAnggota:k.kodeAnggota,namaKepalaKeluarga:k.namaKepalaKeluarga,nomorKK:k.nomorKK,rw:k.rw,rt:k.rt,tahun:+d.tahun,periode:d.periode,nominal:+d.nominal,tanggalPembayaran:d.tgl,catatan:d.catatan||'',idTransaksiKas:kid};db.iuran.push(item);db.kas.push({id:kid,tanggal:d.tgl,jenis:'PEMASUKAN',kategori:'Iuran SOSKEM',nominal:+d.nominal,keterangan:`Iuran ${k.kodeAnggota} - ${k.namaKepalaKeluarga}`,referensiId:id});save();closeModal();render()}}
function formSantunan(){modal('Penyaluran Santunan Duka',`<form id="form"><div class="formgrid"><div class="field full"><label>Pilih KK *</label><select name="kk" required>${selectedKK()}</select></div><div class="field"><label>Nama yang Meninggal *</label><input name="meninggal" required></div><div class="field"><label>Tanggal Wafat</label><input name="tgl" type="date" value="${today()}"></div><div class="field"><label>Ahli Waris *</label><input name="waris" required></div><div class="field"><label>Hubungan</label><input name="hubungan"></div><div class="field"><label>Nominal *</label><input name="nominal" type="number" required></div><div class="field"><label>Catatan</label><input name="catatan"></div></div><div class="footer-actions"><button type="button" class="btn gray" data-close>Batal</button><button class="btn red">Salurkan & Potong Kas</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),k=db.masterKk.find(x=>x.id==d.kk),id=uid(),kid=uid();db.santunan.push({id,masterKkId:k.id,kodeAnggota:k.kodeAnggota,namaKepalaKeluarga:k.namaKepalaKeluarga,namaAnggotaMeninggal:d.meninggal,tanggal:d.tgl,ahliWaris:d.waris,hubunganAhliWaris:d.hubungan,nominal:+d.nominal,catatan:d.catatan||'',idTransaksiKas:kid});db.kas.push({id:kid,tanggal:d.tgl,jenis:'PENGELUARAN',kategori:'Santunan',nominal:+d.nominal,keterangan:`Santunan duka ${k.kodeAnggota} - ${d.meninggal}`,referensiId:id});save();closeModal();render()}}
