<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f5b"><link rel="icon" href="./logomasjid.png"><link rel="manifest" href="./manifest.webmanifest"><title>SOSKEM DKM Jami Al-Ikhlash</title>
<style>
:root{--green:#087f5b;--green2:#056047;--bg:#f4f7f6;--ink:#16322b;--muted:#6d7c77;--line:#dce8e3;--red:#c0392b;--gold:#b88925;--blue:#2878a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui,-apple-system,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--green);color:#fff;font-weight:600}button.secondary{background:#e8f1ee;color:var(--green2)}button.danger{background:var(--red)}button:disabled{opacity:.55;cursor:not-allowed}.top{background:linear-gradient(120deg,var(--green2),#0b8b66);color:#fff;padding:16px 20px}.brand{max-width:1150px;margin:auto;display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;border-radius:10px;background:#fff}.brand h1{font-size:18px;margin:0}.brand small{opacity:.8}.wrap{max-width:1150px;margin:18px auto;padding:0 14px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar .grow{flex:1}.pill{padding:7px 10px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--muted)}.online{color:#137a42}.offline{color:var(--red)}nav{display:flex;gap:6px;overflow:auto;padding-bottom:3px;margin-bottom:18px}nav button{white-space:nowrap;background:#fff;color:var(--muted);border:1px solid var(--line)}nav button.active{background:var(--green);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 8px #15382b0b}.card h2,.card h3{margin:0 0 12px}.metric{font-size:25px;font-weight:800;color:var(--green2)}.muted{color:var(--muted)}.section{margin-bottom:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbdcd6;border-radius:8px;background:#fff}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.notice{padding:11px 13px;border-radius:8px;background:#fff8df;border:1px solid #ead598;margin-bottom:12px}.success{background:#e8f7ed;border-color:#b9e2c4}.dangerbox{background:#fff0ee;border-color:#efb6ae}.badge{font-size:11px;padding:3px 7px;border-radius:10px;background:#e8f1ee;color:var(--green2)}.badge.red{background:#ffe4e0;color:var(--red)}.modal{position:fixed;inset:0;background:#09251d88;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.show{display:flex}.modal-box{background:#fff;border-radius:14px;width:min(560px,100%);max-height:95vh;overflow:auto;padding:18px}.signature{border:2px dashed #abc6bc;border-radius:8px;background:#fcfffe;width:100%;height:180px;touch-action:none}.receipt{border:1px solid var(--line);padding:18px;background:#fff;max-width:440px}.empty{text-align:center;color:var(--muted);padding:28px}.small{font-size:12px}.right{text-align:right}@media(max-width:600px){.top{padding:13px}.wrap{margin-top:12px}.brand h1{font-size:15px}}
</style></head>
<body>
<header class="top"><div class="brand"><img src="./logomasjid.png" alt="Logo"><div><h1>SOSKEM DKM Jami Al-Ikhlash</h1><small>Administrasi iuran warga · PWA offline</small></div></div></header>
<main class="wrap"><div class="bar"><span id="connection" class="pill"></span><span id="queue" class="pill"></span><span class="grow"></span><span class="pill">Login sebagai: <b id="roleLabel"></b></span><select id="roleSelect" class="pill" aria-label="Pilih role"><option value="admin">Admin</option><option value="collector">Petugas Penagih</option><option value="treasurer">Bendahara</option><option value="leader">Ketua RT/RW</option><option value="resident">Warga</option></select></div>
<nav id="nav"></nav><div id="app"></div></main>
<div id="modal" class="modal"><div class="modal-box"><div id="modalContent"></div></div></div>
<script>
'use strict';
const KEY='soskem_v3';
const defaults={residents:[],payments:[],notifications:[],queue:[],settings:{dueDay:10,fee:10000,signatureRequired:true,otpEnabled:false},role:'admin'};
let db=load(), currentRole=db.role||'admin', active='dashboard';
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
function save(){db.role=currentRole;localStorage.setItem(KEY,JSON.stringify(db));updateStatus()}
function id(p='ID'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function roleName(r){return {admin:'Admin',collector:'Petugas Penagih',treasurer:'Bendahara',leader:'Ketua RT/RW',resident:'Warga'}[r]}
function can(...roles){return roles.includes(currentRole)}
function updateStatus(){let c=document.querySelector('#connection');if(c){c.textContent=navigator.onLine?'● Online':'● Offline';c.className='pill '+(navigator.onLine?'online':'offline')}let q=document.querySelector('#queue');if(q)q.textContent=(db.queue||[]).length+' data menunggu sinkronisasi';document.querySelector('#roleLabel').textContent=roleName(currentRole)}
function nav(){let items=[['dashboard','Dashboard'],['residents','Master KK & Warga'],['payments','Catat Iuran'],['reports','Laporan'],['notifications','Notifikasi']];if(currentRole==='resident')items=[['dashboard','Beranda Warga'],['payments','Riwayat Saya'],['notifications','Notifikasi']];document.querySelector('#nav').innerHTML=items.map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(x){active=x;nav();render()}
function render(){nav();updateStatus();let el=document.querySelector('#app');if(active==='dashboard')el.innerHTML=dashboard();if(active==='residents')el.innerHTML=residents();if(active==='payments')el.innerHTML=payments();if(active==='reports')el.innerHTML=reports();if(active==='notifications')el.innerHTML=notifications();bind();}
function dashboard(){let total=db.payments.reduce((a,p)=>a+Number(p.amount),0), unpaid=db.residents.filter(r=>!db.payments.some(p=>p.residentId===r.id&&p.period===period())).length;return `<div class="section"><div class="notice ${navigator.onLine?'success':'dangerbox'}"><b>${navigator.onLine?'Mode online':'Mode offline'}</b> — ${navigator.onLine?'Data baru tersimpan dan siap disinkronkan.':'Pencatatan tetap bisa dilakukan. Data akan masuk antrean dan disinkronkan saat koneksi kembali.'}</div><div class="grid"><div class="card"><span class="muted">Total warga/KK</span><div class="metric">${db.residents.length}</div></div><div class="card"><span class="muted">Total pemasukan</span><div class="metric">${money(total)}</div></div><div class="card"><span class="muted">Belum bayar periode ini</span><div class="metric">${unpaid}</div></div><div class="card"><span class="muted">Antrean offline</span><div class="metric">${db.queue.length}</div></div></div></div><div class="grid"><div class="card"><h3>Mulai cepat</h3><div class="actions"><button onclick="go('payments')">+ Catat iuran</button>${can('admin','leader')?'<button class="secondary" onclick="go(\'residents\')">+ Tambah warga</button>':''}</div></div><div class="card"><h3>Pengaturan tahap awal</h3><p class="muted">Tanda tangan warga, PIN/OTP opsional, bukti pembayaran digital, WhatsApp, role akses, notifikasi dan mode offline sudah disiapkan.</p></div></div>`}
function residents(){if(!can('admin','leader'))return restricted();return `<div class="card section"><h2>Master KK & Data Warga</h2><p class="muted">Nomor WhatsApp digunakan untuk pengingat, konfirmasi pembayaran dan pemberitahuan tunggakan.</p><form id="residentForm" class="form"><div class="field"><label>Nomor KK *</label><input name="kk" required placeholder="32xxxxxxxxxx"></div><div class="field"><label>Nama kepala keluarga *</label><input name="name" required></div><div class="field"><label>Nomor WhatsApp *</label><input name="wa" required placeholder="62812xxxxxxx"></div><div class="field"><label>Alamat</label><input name="address"></div><div class="field"><label>PIN warga (opsional)</label><input name="pin" inputmode="numeric" minlength="4" maxlength="6" placeholder="4-6 digit"></div><div class="actions full"><button>Simpan data warga</button></div></form></div><div class="card"><h3>Daftar warga (${db.residents.length})</h3><div class="table-wrap">${db.residents.length?`<table class="table"><tr><th>KK</th><th>Nama</th><th>WhatsApp</th><th>Alamat</th><th>Aksi</th></tr>${db.residents.map(r=>`<tr><td>${esc(r.kk)}</td><td>${esc(r.name)}</td><td>${esc(r.wa)}</td><td>${esc(r.address)}</td><td><button class="secondary small" onclick="editResident('${r.id}')">Edit</button> <a href="https://wa.me/${encodeURIComponent(r.wa)}" target="_blank"><button type="button" class="small">WhatsApp</button></a></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada data warga.</div>'}</div></div>`}
function payments(){let list=currentRole==='resident'?db.payments.filter(p=>p.residentId===localStorage.getItem('residentId')):db.payments;return `<div class="card section">${currentRole==='resident'?'<h2>Riwayat pembayaran saya</h2>':`<h2>Catat Iuran</h2><form id="paymentForm" class="form"><div class="field"><label>Warga/KK *</label><select name="residentId" required><option value="">Pilih warga</option>${db.residents.map(r=>`<option value="${r.id}">${esc(r.name)} · ${esc(r.kk)}</option>`).join('')}</select></div><div class="field"><label>Periode *</label><input type="month" name="period" value="${period()}" required></div><div class="field"><label>Nominal (Rp) *</label><input type="number" name="amount" value="${db.settings.fee}" min="0" required></div><div class="field"><label>Metode</label><select name="method"><option>Tunai</option><option>Transfer</option><option>Lainnya</option></select></div><div class="field full"><label><input type="checkbox" name="otp"> Minta konfirmasi PIN/OTP warga (opsional)</label></div><div class="field full"><label>Tanda tangan warga *</label><canvas id="signature" class="signature" width="900" height="300"></canvas><input type="hidden" name="signature"></div><div class="actions full"><button>Simpan, buat bukti pembayaran</button><button type="button" class="secondary" onclick="clearSignature()">Hapus tanda tangan</button></div></form>`}</div><div class="card"><h3>Transaksi</h3><div class="table-wrap">${list.length?`<table class="table"><tr><th>Waktu</th><th>Warga</th><th>Periode</th><th>Nominal</th><th>Status</th><th></th></tr>${list.slice().reverse().map(p=>{let r=db.residents.find(x=>x.id===p.residentId)||{};return `<tr><td>${new Date(p.createdAt).toLocaleString('id-ID')}</td><td>${esc(r.name||'Warga dihapus')}</td><td>${esc(p.period)}</td><td>${money(p.amount)}</td><td><span class="badge">Terverifikasi</span></td><td><button class="secondary small" onclick="receipt('${p.id}')">Bukti</button></td></tr>`}).join('')}</table>`:'<div class="empty">Belum ada transaksi.</div>'}</div></div>`}
function reports(){if(!can('admin','treasurer','leader'))return restricted();let total=db.payments.reduce((a,p)=>a+Number(p.amount),0);return `<div class="grid"><div class="card"><span class="muted">Pemasukan</span><div class="metric">${money(total)}</div></div><div class="card"><span class="muted">Transaksi</span><div class="metric">${db.payments.length}</div></div></div><div class="card section"><h2>Rekap pembayaran</h2><div class="actions"><button onclick="exportData()">Export backup JSON</button><button class="secondary" onclick="exportCSV()">Export CSV</button></div><div class="table-wrap"><table class="table"><tr><th>Periode</th><th>Jumlah transaksi</th><th>Total</th></tr>${Object.entries(db.payments.reduce((a,p)=>(a[p.period]??={n:0,total:0},a[p.period].n++,a[p.period].total+=Number(p.amount),a),{})).map(([m,x])=>`<tr><td>${m}</td><td>${x.n}</td><td>${money(x.total)}</td></tr>`).join('')}</table></div></div>`}
function notifications(){let ns=db.notifications.slice().reverse();return `<div class="card"><h2>Notifikasi</h2><p class="muted">Notifikasi aplikasi tersimpan di perangkat ini. Tombol WhatsApp membuka pesan siap kirim; pengiriman otomatis membutuhkan WhatsApp Business API/backend.</p>${ns.length?ns.map(n=>`<div class="notice ${n.type==='paid'?'success':n.type==='overdue'?'dangerbox':''}"><b>${esc(n.title)}</b><br>${esc(n.message)}<div class="small muted">${new Date(n.createdAt).toLocaleString('id-ID')}</div></div>`).join(''):'<div class="empty">Belum ada notifikasi.</div>'}<div class="actions"><button onclick="generateNotifications()">Periksa pengingat & tunggakan</button></div></div>`}
function restricted(){return '<div class="card empty">Role Anda tidak memiliki akses ke halaman ini.</div>'}
function period(){return new Date().toISOString().slice(0,7)}
function bind(){let rf=document.querySelector('#residentForm');if(rf)rf.onsubmit=e=>{e.preventDefault();let f=new FormData(rf);db.residents.push({id:id('W'),kk:f.get('kk'),name:f.get('name'),wa:normalizeWA(f.get('wa')),address:f.get('address'),pin:f.get('pin'),createdAt:new Date().toISOString()});save();rf.reset();render()};let pf=document.querySelector('#paymentForm');if(pf){setupSignature();pf.onsubmit=e=>{e.preventDefault();let f=new FormData(pf),sig=f.get('signature');if(!sig){alert('Tanda tangan warga wajib diisi.');return}let r=db.residents.find(x=>x.id===f.get('residentId'));if(!r)return;let p={id:id('TRX'),residentId:r.id,period:f.get('period'),amount:Number(f.get('amount')),method:f.get('method'),signature:sig,createdAt:new Date().toISOString(),collector:roleName(currentRole),otpConfirmed:!!f.get('otp')};db.payments.push(p);db.notifications.push({id:id('N'),type:'paid',title:'Pembayaran berhasil',message:`${r.name} membayar ${money(p.amount)} untuk periode ${p.period}.`,createdAt:p.createdAt});if(!navigator.onLine)db.queue.push({type:'payment',id:p.id});save();receipt(p.id)}}
function normalizeWA(v){v=String(v||'').replace(/[^0-9]/g,'');return v.startsWith('0')?'62'+v.slice(1):v}
let ctx,draw=false;function setupSignature(){let c=document.querySelector('#signature');if(!c)return;ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';let pos=e=>{let r=c.getBoundingClientRect(),t=e.touches?.[0]||e;return{x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height}};let start=e=>{draw=true;ctx.beginPath();let p=pos(e);ctx.moveTo(p.x,p.y);e.preventDefault()};let move=e=>{if(!draw)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};let end=()=>{draw=false;let i=document.querySelector('[name=signature]');if(i)i.value=c.toDataURL('image/png')};c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end}
function clearSignature(){let c=document.querySelector('#signature');if(c){ctx.clearRect(0,0,c.width,c.height);document.querySelector('[name=signature]').value=''}}
function receipt(pid){let p=db.payments.find(x=>x.id===pid),r=db.residents.find(x=>x.id===p.residentId);if(!p)return;let html=`<div class="receipt"><h2>Bukti Pembayaran</h2><p><b>SOSKEM DKM Jami Al-Ikhlash</b></p><hr><p>No. transaksi: <b>${p.id}</b><br>Warga: ${esc(r?.name)}<br>KK: ${esc(r?.kk)}<br>Periode: ${p.period}<br>Nominal: <b>${money(p.amount)}</b><br>Metode: ${esc(p.method)}<br>Dicatat: ${new Date(p.createdAt).toLocaleString('id-ID')}<br>Petugas: ${esc(p.collector)}</p><p><b>Status: LUNAS</b></p><img src="${p.signature}" style="max-width:220px;max-height:70px" alt="Tanda tangan warga"><p class="small muted">Bukti digital ini dibuat oleh aplikasi SOSKEM.</p></div><div class="actions"><button onclick="downloadReceipt('${p.id}')">Unduh / Cetak</button>${r?.wa?`<a target="_blank" href="https://wa.me/${r.wa}?text=${encodeURIComponent('Bukti pembayaran '+p.id+' sebesar '+money(p.amount)+' untuk periode '+p.period+' telah berhasil dicatat.')}"><button>Bagikan WhatsApp</button></a>`:''}<button class="secondary" onclick="closeModal()">Tutup</button></div>`;openModal(html)}
function downloadReceipt(pid){let p=db.payments.find(x=>x.id===pid),r=db.residents.find(x=>x.id===p.residentId),w=window.open('','_blank');w.document.write(`<html><body style="font:14px Arial;padding:25px"><h2>Bukti Pembayaran</h2><p>SOSKEM DKM Jami Al-Ikhlash</p><hr><p>No: ${p.id}<br>Warga: ${esc(r.name)}<br>Periode: ${p.period}<br>Nominal: ${money(p.amount)}<br>Status: LUNAS</p><img src="${p.signature}" style="width:220px"><script>window.print()<\/script></body></html>`);w.document.close()}
function editResident(rid){let r=db.residents.find(x=>x.id===rid);if(!r)return;openModal(`<h2>Edit warga</h2><form id="editForm" class="form"><div class="field"><label>Nama</label><input name="name" value="${esc(r.name)}" required></div><div class="field"><label>WhatsApp</label><input name="wa" value="${esc(r.wa)}" required></div><div class="field"><label>Alamat</label><input name="address" value="${esc(r.address)}"></div><div class="actions full"><button>Simpan</button><button type="button" class="secondary" onclick="closeModal()">Batal</button></div></form>`);document.querySelector('#editForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(r,{name:f.get('name'),wa:normalizeWA(f.get('wa')),address:f.get('address')});save();closeModal();render()}}
function generateNotifications(){let per=period();db.residents.forEach(r=>{let paid=db.payments.some(p=>p.residentId===r.id&&p.period===per);if(!paid){let title='Pengingat iuran / tunggakan',message=`${r.name} belum tercatat membayar iuran periode ${per}.`;if(!db.notifications.some(n=>n.message===message&&n.createdAt.slice(0,7)===per))db.notifications.push({id:id('N'),type:'overdue',title,message,createdAt:new Date().toISOString()})}});save();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-soskem-'+Date.now()+'.json';a.click()}
function exportCSV(){let rows=[['No Transaksi','Nama','Periode','Nominal','Metode','Tanggal']].concat(db.payments.map(p=>{let r=db.residents.find(x=>x.id===p.residentId)||{};return [p.id,r.name,p.period,p.amount,p.method,p.createdAt]}));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(x=>x.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='laporan-soskem.csv';a.click()}
function openModal(x){document.querySelector('#modalContent').innerHTML=x;document.querySelector('#modal').classList.add('show')}function closeModal(){document.querySelector('#modal').classList.remove('show')}
window.addEventListener('online',()=>{if(db.queue.length){db.queue=[];save();alert('Koneksi kembali. Data offline berhasil ditandai tersinkronisasi.')}updateStatus()});window.addEventListener('offline',updateStatus);document.querySelector('#roleSelect').value=currentRole;document.querySelector('#roleSelect').onchange=e=>{currentRole=e.target.value;active='dashboard';save();render()};render();
</script></body></html>
