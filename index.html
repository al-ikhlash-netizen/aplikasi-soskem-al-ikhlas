<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f5b"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./logomasjid.png">
<title>SOSKEM DKM Jami Al-Ikhlash</title>
<style>
:root{--g:#087f5b;--gold:#b88925;--bg:#f4f7f6;--ink:#16322b;--muted:#6d7c77;--red:#c0392b;--blue:#1769aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#056b4c,#0a9068);color:#fff;padding:14px 16px}.brand{display:flex;align-items:center;gap:12px;max-width:1180px;margin:auto}.brand img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;margin:3px 0 0;opacity:.82}.wrap{max-width:1180px;margin:auto;padding:18px 14px 92px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:15px;border:1px solid #e4ebe8;box-shadow:0 8px 28px #12352a12}.stat b{display:block;font-size:22px;margin-top:6px}.muted{color:var(--muted)}h2{font-size:16px;margin:0 0 10px}.section{margin-top:16px}.toolbar,.actions,.footer{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:650}.btn.gold{background:var(--gold)}.btn.red{background:var(--red)}.btn.gray{background:#e8eeec;color:var(--ink)}.btn.blue{background:var(--blue)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #e9eeec;text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f7faf9}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e4f5ee;color:#08704f;font-size:11px;font-weight:700}.badge.red{background:#fde9e6;color:#a62e24}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe8e4;z-index:20}.nav{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;padding:8px 4px;color:#71807b;font-size:11px}.nav button.active{color:var(--g);font-weight:800}.nav i{display:block;font-style:normal;font-size:19px}.search{width:min(330px,100%);padding:10px 12px;border:1px solid #d9e3df;border-radius:10px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.modalbox{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid #d7e1de;border-radius:9px;padding:10px}.footer{justify-content:flex-end;margin-top:14px}.empty{text-align:center;padding:28px;color:var(--muted)}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}@media print{.top,.bottom,.actions,.btn,.search,.modal{display:none!important}.wrap{padding:0!important}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.tablewrap{overflow:visible}.table{min-width:0}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="./logomasjid.png" alt="Logo Masjid Jami Al-Ikhlash"><div><h1>SOSKEM DKM Jami Al-Ikhlash</h1><p>Sistem Administrasi Sosial Kematian • RW 18, RW 19, RW 20</p></div></div></header>
<main id="content" class="wrap"></main>
<nav class="bottom nav"><button data-page="home">⌂<br>Dashboard</button><button data-page="kk">▣<br>Master KK</button><button data-page="iuran">✓<br>Iuran</button><button data-page="santunan">♥<br>Santunan</button><button data-page="lainnya">☷<br>Lainnya</button></nav>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><input id="fileRestore" type="file" accept="application/json,.json" class="hidden">
<script>
'use strict';
const KEY='SOSKEM_JAMI_AL_IKHLASH_WEB_V2',BACKUP_VERSION='2.5.0',EMPTY={masterKk:[],iuran:[],santunan:[],kas:[],settings:{saldoAwal:0}};
const clone=x=>JSON.parse(JSON.stringify(x));
const safeDb=x=>{const y=x&&typeof x==='object'?x:{};return{masterKk:Array.isArray(y.masterKk)?y.masterKk:[],iuran:Array.isArray(y.iuran)?y.iuran:[],santunan:Array.isArray(y.santunan)?y.santunan:[],kas:Array.isArray(y.kas)?y.kas:[],settings:{...EMPTY.settings,...(y.settings&&typeof y.settings==='object'?y.settings:{})}}};
function load(){try{return safeDb(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(_){return clone(EMPTY)}}
let db=load(),page='home';
const save=()=>localStorage.setItem(KEY,JSON.stringify(safeDb(db))),uid=()=>Date.now()+Math.floor(Math.random()*999),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),rwval=r=>String(r??'').replace(/^RW\s*/i,'').trim(),code=(rw,no)=>`ISK${rwval(rw)}/${String(no??'').trim()}`;
const active=k=>k&&(k.status||'AKTIF')!=='NONAKTIF'&&k.statusKalkulasi!=='NONAKTIF';
function stats(){const masuk=db.kas.filter(x=>x.jenis==='PEMASUKAN').reduce((a,x)=>a+(+x.nominal||0),0),keluar=db.kas.filter(x=>x.jenis==='PENGELUARAN').reduce((a,x)=>a+(+x.nominal||0),0);return{kk:db.masterKk.filter(active).length,iuran:db.iuran.reduce((a,x)=>a+(+x.nominal||0),0),santunan:db.santunan.reduce((a,x)=>a+(+x.nominal||0),0),masuk,keluar,saldo:(+db.settings.saldoAwal||0)+masuk-keluar}}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=({home,kk:master,iuran,santunan,lainnya,kas}[page]||home)();bind()}
function home(){const s=stats();return `<div class="grid">${[['KK Aktif',s.kk],['Total Iuran',rupiah(s.iuran)],['Santunan',rupiah(s.santunan)],['Saldo Kas',rupiah(s.saldo)]].map(x=>`<div class="card stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="section card"><div class="toolbar"><h2>Wilayah</h2><div class="actions"><button class="btn" data-go="kk">Master KK</button><button class="btn gold" data-go="kas">Buku Kas</button></div></div><div class="grid">${['18','19','20'].map(r=>`<div class="card"><small>RW ${r}</small><b>${db.masterKk.filter(k=>active(k)&&rwval(k.rw)===r).length}</b><br><span class="muted">KK aktif</span></div>`).join('')}</div></div><div class="section card"><h2>Mutasi Kas Terbaru</h2>${kasRows(8)}</div>`}
function master(){const q=(document.getElementById('search')?.value||'').toLowerCase(),rows=db.masterKk.filter(x=>JSON.stringify(x).toLowerCase().includes(q));return `<div class="card"><div class="toolbar"><h2>Master KK</h2><div class="actions"><input id="search" class="search" placeholder="Cari KK / nama / kode" value="${esc(q)}"><button class="btn" data-add="kk">+ Tambah KK</button></div></div><div class="tablewrap">${rows.length?`<table class="table"><tr><th>Nama</th><th>Kode ISK</th><th>No KK</th><th>RW/RT</th><th>Status</th><th>Aksi</th></tr>${rows.map(x=>`<tr><td><b>${esc(x.namaKepalaKeluarga||x.nama)}</b><br><small>${esc(x.noHp||x.phone||'')}</small></td><td><span class="badge">${esc(x.kodeAnggota||x.kodeBuku||x.kode||code(x.rw,x.nomorAnggota))}</span></td><td>${esc(x.nomorKK||x.nomor||'-')}</td><td>${esc(rwval(x.rw))}/${esc(x.rt||'-')}</td><td>${esc(x.status||'AKTIF')}</td><td><button class="btn gray" data-edit="${esc(x.id)}">Edit</button> <button class="btn red" data-del="${esc(x.id)}">Nonaktifkan</button></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada data Master KK.</div>'}</div></div>`}
function iuran(){return `<div class="card"><div class="toolbar"><h2>Pembayaran Iuran</h2><button class="btn" data-add="iuran">+ Catat Iuran</button></div><div class="tablewrap">${db.iuran.length?`<table class="table"><tr><th>ISK/Keluarga</th><th>No KK</th><th>RW/RT</th><th>Tahun</th><th>Triwulan</th><th>Nominal</th><th>Tanggal</th></tr>${db.iuran.slice().reverse().map(x=>`<tr><td><b>${esc(x.kodeAnggota||x.kode)}</b><br>${esc(x.namaKepalaKeluarga||'')}</td><td>${esc(x.nomorKK||'-')}</td><td>${esc(rwval(x.rw))}/${esc(x.rt||'-')}</td><td>${esc(x.tahun)}</td><td>${esc(x.periode||quarters(x))}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.tanggalPembayaran||x.tanggal)}</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada pencatatan iuran.</div>'}</div></div>`}
function santunan(){return `<div class="card"><div class="toolbar"><h2>Penyaluran Santunan</h2><button class="btn red" data-add="santunan">+ Salurkan Santunan</button></div><div class="tablewrap">${db.santunan.length?`<table class="table"><tr><th>Keluarga/ISK</th><th>Almarhum</th><th>Ahli Waris</th><th>No KK</th><th>RW/RT</th><th>Tanggal</th><th>Nominal</th></tr>${db.santunan.slice().reverse().map(x=>`<tr><td>${esc(x.kodeAnggota||x.kode)}<br>${esc(x.namaKepalaKeluarga||'')}</td><td>${esc(x.namaAnggotaMeninggal||x.namaMeninggal)}</td><td>${esc(x.ahliWaris||x.waris)}<br>${esc(x.hubunganAhliWaris||x.hubungan||'')}</td><td>${esc(x.nomorKK||'-')}</td><td>${esc(rwval(x.rw))}/${esc(x.rt||'-')}</td><td>${esc(x.tanggal)}</td><td>${rupiah(x.nominal)}</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada pencatatan santunan.</div>'}</div></div>`}
function lainnya(){return `<div class="grid"><div class="card"><h2>Buku Kas</h2><button class="btn" data-go="kas">Buka Buku Kas</button></div><div class="card"><h2>Laporan</h2><button class="btn blue" data-report>Pratinjau / Cetak</button></div><div class="card"><h2>Backup & Restore</h2><button class="btn gold" data-backup>Backup JSON</button> <button class="btn gray" data-restore>Restore</button></div><div class="card"><h2>Pengaturan</h2><button class="btn gray" data-settings>Pengaturan</button></div></div><div class="section card"><div class="muted">Format backup: ${BACKUP_VERSION}. Data tersimpan lokal di perangkat.</div></div>`}
function kasRows(limit=0){const rows=(limit?db.kas.slice().reverse().slice(0,limit):db.kas.slice().reverse());return rows.length?`<div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Nominal</th><th>Keterangan</th>${limit?'':'<th>Aksi</th>'}</tr>${rows.map(x=>`<tr><td>${esc(x.tanggal)}</td><td>${esc(x.jenis)}</td><td>${esc(x.kategori)}</td><td>${rupiah(x.nominal)}</td><td>${esc(x.keterangan||x.deskripsi)}</td>${limit?'':`<td>${x.referensiId?'<span class="muted">Sumber transaksi</span>':`<button class="btn red" data-kasdel="${x.id}">Hapus</button>`}</td>`}</tr>`).join('')}</table></div>`:'<div class="empty">Belum ada mutasi kas.</div>'}
function kas(){const s=stats();return `<div class="grid">${[['Saldo Awal',db.settings.saldoAwal],['Pemasukan',s.masuk],['Pengeluaran',s.keluar],['Saldo',s.saldo]].map(x=>`<div class="card stat"><small>${x[0]}</small><b>${rupiah(x[1])}</b></div>`).join('')}</div><div class="section card"><div class="toolbar"><h2>Buku Kas SOSKEM</h2><button class="btn" data-add="kas">+ Tambah Mutasi</button></div>${kasRows()}</div>`}
function modal(title,body){document.getElementById('modalbox').innerHTML=`<h3>${title}</h3>${body}`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modalbox').replaceChildren()}
function selectedKK(){return db.masterKk.filter(active).map(x=>`<option value="${x.id}">${esc(x.kodeAnggota||x.kode)} — ${esc(x.namaKepalaKeluarga||x.nama)} — ${esc(x.nomorKK||x.nomor||'')}</option>`).join('')}
function formKK(x={}){const rw=rwval(x.rw)||'18',no=x.nomorAnggota||String(db.masterKk.filter(k=>rwval(k.rw)===rw).length+1).padStart(3,'0');modal(x.id?'Edit Master KK':'Tambah Master KK',`<form id="form"><div class="formgrid"><div class="field"><label>Nama Kepala Keluarga *</label><input name="nama" required value="${esc(x.namaKepalaKeluarga||x.nama)}"></div><div class="field"><label>Nomor KK</label><input name="kk" maxlength="16" value="${esc(x.nomorKK||x.nomor)}"></div><div class="field"><label>RW *</label><select name="rw"><option ${rw==='18'?'selected':''}>18</option><option ${rw==='19'?'selected':''}>19</option><option ${rw==='20'?'selected':''}>20</option></select></div><div class="field"><label>RT</label><input name="rt" value="${esc(x.rt||'01')}"></div><div class="field"><label>Nomor Anggota *</label><input name="no" required value="${esc(no)}"></div><div class="field"><label>Status</label><select name="status"><option ${x.status!=='NONAKTIF'?'selected':''}>AKTIF</option><option ${x.status==='NONAKTIF'?'selected':''}>NONAKTIF</option></select></div><div class="field"><label>No HP</label><input name="hp" value="${esc(x.noHp||x.phone)}"></div><div class="field"><label>Tanggal Terdaftar</label><input name="tgl" type="date" value="${esc(x.tanggalTerdaftar||today())}"></div><div class="field full"><label>Alamat</label><textarea name="alamat">${esc(x.alamatDetail||x.alamat||'')}</textarea></div></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),c=code(d.rw,d.no),dup=db.masterKk.some(k=>String(k.id)!==String(x.id)&&(k.kodeAnggota||k.kodeBuku||k.kode)===c);if(dup)return alert('Kode ISK tersebut sudah digunakan.');const item={...x,id:x.id||uid(),namaKepalaKeluarga:d.nama,nomorKK:d.kk,rw:d.rw,rt:d.rt,nomorAnggota:d.no,kodeAnggota:c,kodeBuku:c,status:d.status,noHp:d.hp,tanggalTerdaftar:d.tgl,alamatDetail:d.alamat};const i=db.masterKk.findIndex(k=>String(k.id)===String(item.id));i<0?db.masterKk.push(item):db.masterKk[i]=item;save();closeModal();render()}}
function formIuran(){modal('Pencatatan Iuran',`<form id="form"><div class="formgrid"><div class="field full"><label>KK *</label><select name="kk" required>${selectedKK()}</select></div><div class="field"><label>Tahun *</label><input name="tahun" type="number" required value="${new Date().getFullYear()}"></div><div class="field"><label>Nominal (harus > 0) *</label><input name="nominal" type="number" min="1" required></div><div class="field full"><label>Triwulan — pilih minimal satu *</label><div><label><input type="checkbox" name="q1"> Q1</label> <label><input type="checkbox" name="q2"> Q2</label> <label><input type="checkbox" name="q3"> Q3</label> <label><input type="checkbox" name="q4"> Q4</label></div></div><div class="field"><label>Tanggal Bayar</label><input name="tgl" type="date" value="${today()}"></div><div class="field"><label>Catatan</label><input name="catatan"></div></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan & Masuk Kas</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),qs=['q1','q2','q3','q4'].filter(q=>e.target[q].checked),nom=Number(d.nominal),year=Number(d.tahun),k=db.masterKk.find(x=>String(x.id)===String(d.kk));if(!qs.length)return alert('Pilih minimal satu triwulan.');if(!(nom>0))return alert('Nominal harus lebih besar dari nol.');if(db.iuran.some(x=>String(x.masterKkId)===String(k.id)&&Number(x.tahun)===year&&qs.some(q=>x[q])))return alert('Salah satu triwulan sudah dibayar untuk KK dan tahun tersebut.');const id=uid(),kid=uid(),item={id,masterKkId:k.id,kodeAnggota:k.kodeAnggota,namaKepalaKeluarga:k.namaKepalaKeluarga,nomorKK:k.nomorKK,rw:k.rw,rt:k.rt,tahun:year,q1:qs.includes('q1'),q2:qs.includes('q2'),q3:qs.includes('q3'),q4:qs.includes('q4'),nominal:nom,tanggalPembayaran:d.tgl,catatan:d.catatan||'',idTransaksiKas:kid};db.iuran.push(item);db.kas.push({id:kid,tanggal:d.tgl,jenis:'PEMASUKAN',kategori:'Iuran SOSKEM',nominal:nom,keterangan:`Iuran ${k.kodeAnggota} - ${k.namaKepalaKeluarga}`,referensiId:id});save();closeModal();render()}}
function formSantunan(){modal('Penyaluran Santunan',`<form id="form"><div class="formgrid"><div class="field full"><label>KK *</label><select name="kk" required>${selectedKK()}</select></div><div class="field"><label>Nama yang Meninggal *</label><input name="meninggal" required></div><div class="field"><label>Tanggal Wafat</label><input name="tgl" type="date" value="${today()}"></div><div class="field"><label>Ahli Waris *</label><input name="waris" required></div><div class="field"><label>Hubungan</label><input name="hubungan"></div><div class="field"><label>Nominal harus > 0 *</label><input name="nominal" type="number" min="1" required></div><div class="field"><label>Catatan</label><input name="catatan"></div></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn red">Salurkan & Potong Kas</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),nom=Number(d.nominal),k=db.masterKk.find(x=>String(x.id)===String(d.kk));if(!(nom>0))return alert('Nominal harus lebih besar dari nol.');const id=uid(),kid=uid();db.santunan.push({id,masterKkId:k.id,kodeAnggota:k.kodeAnggota,namaKepalaKeluarga:k.namaKepalaKeluarga,nomorKK:k.nomorKK,rw:k.rw,rt:k.rt,namaAnggotaMeninggal:d.meninggal,tanggal:d.tgl,ahliWaris:d.waris,hubunganAhliWaris:d.hubungan||'',nominal:nom,catatan:d.catatan||'',idTransaksiKas:kid});db.kas.push({id:kid,tanggal:d.tgl,jenis:'PENGELUARAN',kategori:'Santunan',nominal:nom,keterangan:`Santunan duka ${k.kodeAnggota} - ${d.meninggal}`,referensiId:id});save();closeModal();render()}}
function formKas(){modal('Tambah Mutasi Kas',`<form id="form"><div class="formgrid"><div class="field"><label>Tanggal</label><input name="tgl" type="date" value="${today()}"></div><div class="field"><label>Jenis</label><select name="jenis"><option>PEMASUKAN</option><option>PENGELUARAN</option></select></div><div class="field"><label>Kategori</label><input name="kat" value="Lainnya"></div><div class="field"><label>Nominal *</label><input name="nominal" type="number" min="1" required></div><div class="field full"><label>Keterangan *</label><textarea name="ket" required></textarea></div></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!(Number(d.nominal)>0))return alert('Nominal harus lebih besar dari nol.');db.kas.push({id:uid(),tanggal:d.tgl,jenis:d.jenis,kategori:d.kat,nominal:Number(d.nominal),keterangan:d.ket,referensiId:null});save();closeModal();render()}}
function settings(){modal('Pengaturan',`<form id="form"><div class="field"><label>Saldo Awal Kas</label><input name="saldo" type="number" value="${db.settings.saldoAwal||0}"></div><div class="footer"><button type="button" class="btn gray" data-close>Batal</button><button class="btn">Simpan</button></div></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();db.settings.saldoAwal=Number(new FormData(e.target).get('saldo'))||0;save();closeModal();render()}}
function quarters(x){return ['q1','q2','q3','q4'].filter(q=>x[q]).map(q=>q.toUpperCase()).join(', ')||'-'}
function backup(){const payload={app:'SOSKEM DKM Jami Al-Ikhlash',version:BACKUP_VERSION,exportedAt:new Date().toISOString(),data:clone(db),...clone(db)};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`BACKUP_SOSKEM_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function normalizeRestore(raw){let x=raw;if(x?.data&&typeof x.data==='object'&&!Array.isArray(x.data))x=x.data;else if(x?.database&&typeof x.database==='object')x=x.database;else if(x?.state&&typeof x.state==='object')x=x.state;const arr=(...keys)=>{for(const k of keys)if(Array.isArray(x?.[k]))return x[k];return[]},obj=(...keys)=>{for(const k of keys)if(x?.[k]&&typeof x[k]==='object'&&!Array.isArray(x[k]))return x[k];return{}};const settings=obj('settings','pengaturan','config'),master=arr('masterKk','masterKK','master_kk','kk','keluarga','masterKeluarga'),ii=arr('iuran','Iuran','pembayaranIuran','payments','log_iuran'),ss=arr('santunan','Santunan','klaimSantunan','claims','log_klaim'),kk=arr('kas','Kas','transaksiKas','transactions','mutasiKas');const m=master.map((r,i)=>{const rw=rwval(r.rw||String(r.kode||'').match(/ISK(\d+)/i)?.[1]||''),no=r.nomorAnggota||String(r.kode||'').split('/')[1]||String(i+1).padStart(3,'0'),c=r.kodeAnggota||r.kodeBuku||r.kode||code(rw,no);return{...r,id:r.id??uid(),rw,kodeAnggota:c,kodeBuku:r.kodeBuku||c,nomorAnggota:no,namaKepalaKeluarga:r.namaKepalaKeluarga||r.nama||'',nomorKK:r.nomorKK||r.nomor||'',status:r.status||'AKTIF'}}),find=c=>m.find(k=>(k.kodeAnggota||k.kode)===c);return{masterKk:m,iuran:ii.map(r=>{const k=find(r.kode||r.kodeAnggota);return{...r,id:r.id??uid(),masterKkId:r.masterKkId??k?.id,kodeAnggota:r.kodeAnggota||r.kode,namaKepalaKeluarga:r.namaKepalaKeluarga||k?.namaKepalaKeluarga||'',nomorKK:r.nomorKK||k?.nomorKK||'',rw:r.rw||k?.rw,rt:r.rt||k?.rt,nominal:Number(r.nominal)||0,tahun:Number(r.tahun||r.year)||new Date(r.tanggal||Date.now()).getFullYear()}}),santunan:ss.map(r=>{const k=find(r.kode||r.kodeAnggota);return{...r,id:r.id??uid(),masterKkId:r.masterKkId??k?.id,kodeAnggota:r.kodeAnggota||r.kode,namaKepalaKeluarga:r.namaKepalaKeluarga||k?.namaKepalaKeluarga||'',nomorKK:r.nomorKK||k?.nomorKK||'',rw:r.rw||k?.rw,rt:r.rt||k?.rt,nominal:Number(r.nominal)||0,tanggal:r.tanggal||today()}}),kas:kk,settings:{...settings,saldoAwal:Number(settings.saldoAwal??settings.saldo_awal??0)||0}}}
function restore(){const input=document.getElementById('fileRestore');input.value='';input.click()}
document.getElementById('fileRestore').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader;r.onload=()=>{const old=localStorage.getItem(KEY);try{const imported=normalizeRestore(JSON.parse(String(r.result||'')));if(!['masterKk','iuran','santunan','kas'].some(k=>imported[k].length))throw Error('empty');const text=['masterKk','iuran','santunan','kas'].map(k=>`${k}: ${imported[k].length}`).join('\n');if(!confirm(`Data ditemukan:\n\n${text}\n\nGanti data lokal saat ini?`))return;db=imported;save();const check=load();if(['masterKk','iuran','santunan','kas'].some(k=>check[k].length!==imported[k].length))throw Error('verification');render();alert(`Restore berhasil.\n${text}`)}catch(err){if(old!==null)localStorage.setItem(KEY,old);else localStorage.removeItem(KEY);db=load();console.error(err);alert('JSON tidak valid atau format tidak dapat dibaca. Data lama tidak diubah.')}finally{e.target.value=''}};r.onerror=()=>alert('File JSON tidak dapat dibaca.');r.readAsText(f,'utf-8')}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});const s=document.getElementById('search');if(s)s.oninput=()=>render();document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>({kk:formKK,iuran:formIuran,santunan:formSantunan,kas:formKas}[b.dataset.add])());document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelectorAll('[data-backup]').forEach(b=>b.onclick=backup);document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=restore);document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=settings);document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{const s=stats();modal('Laporan',`<div class="card"><h2>SOSKEM DKM Jami Al-Ikhlash</h2><p>KK Aktif: ${s.kk}</p><p>Total Iuran: ${rupiah(s.iuran)}</p><p>Santunan: ${rupiah(s.santunan)}</p><p>Saldo: ${rupiah(s.saldo)}</p><div class="footer"><button class="btn" data-print>Cetak</button><button class="btn gray" data-close>Tutup</button></div></div>`);bind()});document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>window.print());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>formKK(db.masterKk.find(x=>String(x.id)===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const x=db.masterKk.find(x=>String(x.id)===b.dataset.del);if(x&&confirm(`Nonaktifkan ${x.namaKepalaKeluarga||x.nama}?`)){x.status='NONAKTIF';save();render()}});document.querySelectorAll('[data-kasdel]').forEach(b=>b.onclick=()=>{const x=db.kas.find(x=>String(x.id)===b.dataset.kasdel);if(x?.referensiId)return alert('Transaksi sumber Iuran/Santunan tidak dapat dihapus.');if(confirm('Hapus mutasi kas ini?')){db.kas=db.kas.filter(x=>String(x.id)!==b.dataset.kasdel);save();render()}})}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});render();
